      listing_type:
        allOf:
        - $ref: '#/definitions/github_com_oginoino_toca-core_internal_domain_core_property.ListingType'
        enum:
        - sale
        - rent
      media:
        $ref: '#/definitions/github_com_oginoino_toca-core_internal_domain_core_property.Media'
      owner:
        allOf:
        - $ref: '#/definitions/github_com_oginoino_toca-core_internal_domain_core_property.OwnerRef'
        description: Legacy single owner/broker (kept for backward compatibility)
      owners:
        description: 'Multi-owner support: multiple owners with ownership percentage'
        items:
          $ref: '#/definitions/github_com_oginoino_toca-core_internal_domain_core_property.OwnerRef'
        type: array
      partnership_portfolio:
        description: PartnershipPortfolio indicates this property is shared in the
          partnership portfolio
        type: boolean
      pricing:
        $ref: '#/definitions/github_com_oginoino_toca-core_internal_domain_core_property.Pricing'
      property_type:
        allOf:
        - $ref: '#/definitions/github_com_oginoino_toca-core_internal_domain_core_property.PropertyType'
        enum:
        - apartment
        - house
        - land
        - commercial
      publication_status:
        allOf:
        - $ref: '#/definitions/github_com_oginoino_toca-core_internal_domain_core_property.PublicationStatus'
        enum:
        - draft
        - published
      status:
        allOf:
        - $ref: '#/definitions/github_com_oginoino_toca-core_internal_domain_core_property.PropertyStatus'
        enum:
        - prospecting
        - in_portfolio
        - published
        - attending
        - negotiating
        - proposal
        - analysis
        - contract
        - rented
        - sold
        - administered
        - rescission
        - available
        - inactive
      tags:
        items:
          type: string
        type: array
      tenant_id:
        description: TenantID is the identifier for multi-tenancy context (AccountID)
        type: string
      title:
        type: string
