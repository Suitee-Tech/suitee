host: localhost:8085
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: Financial service for Toca ecosystem
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Toca Financial API
  version: "1.0"
paths:
  /charges:
    get:
      consumes:
      - application/json
      description: List charges with pagination and filters
      parameters:
      - description: Contract ID
        in: query
        name: contract_id
        type: string
      - description: Status
        in: query
        name: status
        type: string
      - description: Reference Month
        in: query
        name: reference_month
        type: string
      - description: Limit
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/github_com_oginoino_toca_toca-financial_internal_domain_charge.Charge'
                  type: array
              type: object
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: List charges
      tags:
      - charges
    post:
      consumes:
      - application/json
      description: Create a new charge
      parameters:
      - description: Create Charge Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.CreateChargeRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/github_com_oginoino_toca_toca-financial_internal_domain_charge.Charge'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Create charge
      tags:
      - charges
  /charges/{id}:
    get:
      consumes:
      - application/json
      description: Get a charge by its ID
      parameters:
      - description: Charge ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/github_com_oginoino_toca_toca-financial_internal_domain_charge.Charge'
              type: object
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Get charge by ID
      tags:
      - charges
    put:
      consumes:
      - application/json
      description: Update charge details
      parameters:
      - description: Charge ID
        in: path
        name: id
        required: true
        type: string
      - description: Update Charge Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.UpdateChargeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/github_com_oginoino_toca_toca-financial_internal_domain_charge.Charge'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Update charge
      tags:
      - charges
  /charges/{id}/cancel:
    post:
      consumes:
      - application/json
      description: Cancela uma cobrança PENDING/OVERDUE. Bloqueia PAID/CANCELLED com
        409. Reason vai para o audit.
      parameters:
      - description: Charge ID
        in: path
        name: id
        required: true
        type: string
      - description: Cancel
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.CancelChargeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/github_com_oginoino_toca_toca-financial_internal_domain_charge.Charge'
              type: object
        "400":
          description: reason vazio
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: charge não existe
          schema:
            $ref: '#/definitions/response.Response'
        "409":
          description: já paga ou já cancelada
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Cancel a charge
      tags:
      - charges
  /charges/{id}/notify:
    post:
      consumes:
      - application/json
      description: Dispatches an email + in-app reminder for the charge to the payer
        lead.
      parameters:
      - description: Charge ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/github_com_oginoino_toca_toca-financial_internal_services.NotifyResult'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Send reminder for a charge
      tags:
      - charges
  /charges/{id}/pay:
    post:
      consumes:
      - application/json
      description: Mark a charge as paid
      parameters:
      - description: Charge ID
        in: path
        name: id
        required: true
        type: string
      - description: Pay Charge Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.PayChargeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/github_com_oginoino_toca_toca-financial_internal_domain_charge.Charge'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Pay charge
      tags:
      - charges
  /charges/{id}/payment-link:
    post:
      description: Cria o link de cobrança (Pix/boleto) da charge via provedor de
        pagamentos (P1-05). 409 quando o ambiente não tem provedor configurado.
      parameters:
      - description: Charge ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/internal_handlers.PaymentLinkResponse'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
        "409":
          description: payment provider not configured
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Generate payment link for a charge
      tags:
      - charges
  /charges/{id}/receipt:
    get:
      description: Devolve o recibo PDF da cobrança paga. 400 se status != PAID.
      parameters:
      - description: Charge ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/pdf
      responses:
        "200":
          description: OK
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Download charge receipt PDF
      tags:
      - charges
  /charges/{id}/reconcile-manual:
    post:
      consumes:
      - application/json
      description: Marca a charge como paga manualmente (sem gateway). Audita operador
        + proof.
      parameters:
      - description: Charge ID
        in: path
        name: id
        required: true
        type: string
      - description: Reconciliation
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.ReconcileManualRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/github_com_oginoino_toca_toca-financial_internal_domain_charge.Charge'
              type: object
      security:
      - BearerAuth: []
      summary: Reconcile a charge off-platform (manual)
      tags:
      - charges
  /charges/{id}/repair-rental-allocations:
    post:
      consumes:
      - application/json
      description: |-
        Re-deriva as alocações dos pagamentos sem a fatia de intermediação (financia comissão/payout),
        estorna e regrava o lançamento de recebimento e reconcilia o repasse do proprietário.
      parameters:
      - description: Charge ID
        in: path
        name: id
        required: true
        type: string
      - description: Repair
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.RepairRentalAllocationsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: Repara alocações de uma cobrança de locação quitada antes do plano
        de intermediação
      tags:
      - charges
  /charges/{id}/repair-rental-allocations/eligibility:
    get:
      description: 'Read-only: informa se a cobrança de locação quitada tem algo a
        reparar (gate do botão no painel).'
      parameters:
      - description: Charge ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: Elegibilidade do reparo de alocação de locação
      tags:
      - charges
  /charges/overdue:
    get:
      consumes:
      - application/json
      description: List all overdue charges for a tenant
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/github_com_oginoino_toca_toca-financial_internal_domain_charge.Charge'
                  type: array
              type: object
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: List overdue charges
      tags:
      - charges
  /client-portal/charges:
    get:
      description: Cliente lista charges próprias — tenant_lead (cobranças a pagar)
        ou owner_lead (charges das próprias propriedades).
      parameters:
      - description: Filter by status (PENDING, PAID, OVERDUE, CANCELLED)
        in: query
        name: status
        type: string
      - description: Filter by reference month (YYYY-MM)
        in: query
        name: reference_month
        type: string
      - description: Page size (default 20, max 100)
        in: query
        name: limit
        type: integer
      - description: Page offset (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/github_com_oginoino_toca_toca-financial_internal_domain_charge.Charge'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: '[Portal] List my charges'
      tags:
      - client-portal
  /client-portal/charges/{id}:
    get:
      description: Cliente busca uma charge própria (validada por account_id)
      parameters:
      - description: Charge ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/github_com_oginoino_toca_toca-financial_internal_domain_charge.Charge'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
