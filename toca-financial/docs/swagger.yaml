  internal_handlers.GenerateDimobRequest:
    properties:
      company_cnpj:
        description: |-
          CompanyCNPJ / CompanyName identificam a declarante (a imobiliária)
          no registro R01 do TXT da DIMOB (#418). Opcionais no binding para
