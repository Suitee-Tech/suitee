      debtor_name:
        type: string
      guarantee:
        allOf:
        - $ref: '#/definitions/github_com_oginoino_toca_toca-financial_internal_domain_collection.GuaranteeActivation'
        description: |-
          Guarantee — registro do acionamento da garantia locatícia,
          presente quando a cobrança escalou para GUARANTEE_ACTIVATED (#447).
      id:
        type: string
      judicial:
        allOf:
        - $ref: '#/definitions/github_com_oginoino_toca_toca-financial_internal_domain_collection.JudicialProcess'
        description: |-
          Judicial — metadados do processo judicial, presente quando a
          cobrança escalou para JUDICIAL (#448). Embutido no metadata JSONB.
      negotiated_amount:
        type: number
      negotiated_date:
        type: string
      notes:
        type: string
      source_event_id:
        description: |-
          SourceEventID — chave de idempotência derivada do header
          Idempotency-Key. Backed por índice único parcial no PostgreSQL
          (uq_financial_collections_source_event_id) para evitar duplicatas
          em re-submissões de criação manual (FIN-COM-12).
        type: string
      status:
        $ref: '#/definitions/github_com_oginoino_toca_toca-financial_internal_domain_collection.Status'
      tenant_id:
        type: string
      total_debt:
        type: number
      updated_at:
        type: string
    type: object
  github_com_oginoino_toca_toca-financial_internal_domain_collection.CollectionStats:
