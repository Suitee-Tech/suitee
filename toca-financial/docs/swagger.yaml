  github_com_oginoino_toca_toca-financial_internal_domain_commission.Commission:
    properties:
      amount:
        type: number
      approved_by:
        type: string
      broker_id:
        type: string
      cancelled_at:
        type: string
      contract_id:
        type: string
      created_at:
        type: string
      currency:
        type: string
      customer_id:
        type: string
      deal_id:
        type: string
      deductions:
        items:
          $ref: '#/definitions/github_com_oginoino_toca_toca-financial_internal_domain_commission.Deduction'
        type: array
      funded_amount_cents:
        type: integer
      funding_entries:
        items:
          $ref: '#/definitions/github_com_oginoino_toca_toca-financial_internal_domain_commission.FundingEntry'
        type: array
      funding_required_cents:
        description: |-
          FundingRequiredCents gates automatic sale and rental commissions on
          collected receipts. Explicit manual obligations may keep zero.
        type: integer
      gross_amount:
        type: number
      id:
        type: string
      ledger_transaction_id:
        description: |-
          LedgerTransactionID is the stable posting created for this obligation by
          the manual posting command. It is deliberately the Transaction primary
          key: one deterministic identity is enough to make lifecycle synchronization
          and reconciliation unambiguous, including when plan_hash is absent.
        type: string
      net_amount:
        type: number
      note:
        type: string
      owner_id:
        type: string
      paid_at:
        type: string
      payout_order_id:
        type: string
      percentage:
        type: number
      plan_hash:
        description: 'FIN-COM-04: links commission to its resolved plan'
        type: string
      proof_url:
        type: string
      property_id:
        type: string
      requested_by:
        description: |-
          RequestedBy / ApprovedBy — fechamento do achado A13 (segregação de funções)
          no caminho STANDALONE. Antes, o ator existia apenas na trilha de auditoria:
          sem o autor no estado não havia como comparar criador × aprovador nem
          aprovador × pagador, e `financeiro` (que tem `finance:write` e
          `finance:approve_transfer`) criava e aprovava a própria comissão.
          Vazio é dado legado/worker e NÃO cria conflito (mesma decisão dos fluxos de
          transfer/payout/withdrawal).
        type: string
      role:
        type: string
      source_event_id:
        type: string
      status:
        $ref: '#/definitions/github_com_oginoino_toca_toca-financial_internal_domain_commission.Status'
      tenant_id:
        type: string
      updated_at:
        type: string
    type: object
