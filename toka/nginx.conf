map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Gzip compression
  gzip on;
  gzip_types text/plain text/css text/javascript application/json application/javascript;
  gzip_min_length 1000;

  # Cache headers for static assets
  location = /env.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
  }

  location ~* \.mjs$ {
    default_type application/javascript;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|webmanifest)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # O index.html (e o fallback do SPA) NUNCA é cacheado. Um HTML velho referencia
  # chunks com hash antigo: depois de um deploy a rota lazy quebra com 404 em
  # /assets/*.js. `no-store` (não apenas `no-cache`) impede o cache também no
  # iOS, que costuma reutilizar o HTML sem revalidar. Sem `expires` para não
  # duplicar o header `Cache-Control`.
  location ~* \.html$ {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
  }

  # Ajuste para uploads maiores (anexos)
  client_max_body_size 50m;

  # WebSocket (precisa vir antes do proxy genérico /api/)
  location = /api/v1/ws {
    proxy_pass http://gateway:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # AI → Gateway (mesma origem)
  location ^~ /api/v1/ai/ {
    proxy_pass http://gateway:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  # API → Gateway (mesma origem)
  location ^~ /api/ {
    proxy_pass http://gateway:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Clicksign → Gateway → toca-signature.
  # A URL histórica do webhook é https://app.example.com/webhooks/clicksign
  # (domínio do frontend), mas o handler público vive no gateway. Sem este
  # location o nginx respondia 405 e a Clicksign desativava o hook após 10 dias
  # de falhas. Mantemos o caminho canônico na API e este alias no app para não
  # depender de o painel da Clicksign ser reconfigurado no mesmo dia.
  location = /webhooks/clicksign {
    proxy_pass http://gateway:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
  }

  # Uploads → Gateway → Comm (/uploads)
  location ^~ /uploads/ {
    proxy_pass http://gateway:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
