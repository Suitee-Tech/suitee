# P1-13 — ClamAV no funil de uploads, configurado para o host de produção
# (VPS ~4 GB de RAM): baixa APENAS o banco principal (main.cvd).
#
# - Bytecode no + ExcludeDatabase daily/bytecode: clamd carrega só o main
#   (~90 MB em disco, ~350-400 MB de RSS) em vez de ~950 MB dos três bancos;
# - quando o host crescer, basta remover as exclusões para voltar à
#   cobertura completa (main + daily + bytecode).
DatabaseDirectory /var/lib/clamav
DatabaseMirror database.clamav.net
DatabaseOwner clamav
Bytecode no
ExcludeDatabase daily
ExcludeDatabase bytecode
CompressLocalDatabase yes
ScriptedUpdates no
