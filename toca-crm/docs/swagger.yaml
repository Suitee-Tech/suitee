      id:
        type: string
      requested_by:
        description: accountID
        type: string
      result_bucket:
        type: string
      result_path:
        type: string
      result_url:
        description: |-
          ResultURL é o link pré-assinado quando SUCCEEDED. Vazio enquanto
          QUEUED/RUNNING/FAILED.
        type: string
      row_count:
        type: integer
      started_at:
        type: string
      status:
        $ref: '#/definitions/exports.Status'
      tenant_id:
        type: string
    type: object
  exports.Status:
