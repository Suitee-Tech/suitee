        type: integer
      id:
        type: string
      label:
        type: string
    type: object
  github_com_oginoino_toca_toca-crm_internal_domain_lead.Lead:
    properties:
      accountID:
        description: AccountID links to the unified auth account for client portal
          access
        type: string
      assignedAt:
        description: SLA and Routing fields
        type: string
      assignedBrokerID:
        type: string
      authID:
        type: string
      authProvider:
        type: string
      avatar:
        type: string
      captacaoPropertyID:
        description: Captação lead fields — set when this lead represents an owner
          from property acquisition
        type: string
      contractID:
        description: ContractID is set when the lead is converted to a client via
          a signed contract
        type: string
      createdAt:
        type: string
      displayID:
        type: string
      email:
        type: string
      escalationLevel:
        type: integer
      expiresAt:
        type: string
      firstContactAt:
        description: |-
          FirstContactAt — registrada quando o corretor faz o primeiro
          contato com o lead (telefone, WhatsApp, etc.) ou quando o status
          transita explicitamente para CONTACTED. Issue #427.

          SLA primeiro contato: leads atribuídos sem FirstContactAt em 1h
          (configurável via FirstContactSLAMinutes) disparam evento
          lead.first_contact_sla_violated. Worker em LeadSLAService varre
          a cada minuto.

          Idempotência: uma vez setado, MarkFirstContact() não sobrescreve.
          O timestamp original é o que importa — o primeiro contato cumpriu
          (ou violou) o SLA e isso é o que ficou registrado.
        type: string
      firstContactSLAViolatedAt:
        description: |-
          FirstContactSLAViolatedAt — preenchido quando o worker detecta
          que o lead atravessou o limite de 1h sem first contact. Marca o
          evento como já notificado (idempotência: lead que já violou não
          dispara evento duplicado).
        type: string
      history:
        items:
          $ref: '#/definitions/github_com_oginoino_toca_toca-crm_internal_domain_lead.LeadHistory'
        type: array
      id:
        type: string
      isClient:
        description: |-
          Client segmentation — set when lead is converted to a client
          A lead keeps the same ID throughout its lifecycle (lead → client)
        type: boolean
      lastInteraction:
        type: string
      name:
        type: string
      ownerLeadID:
        description: owner lead linked at captação
        type: string
      partnership_shared:
        description: |-
          PartnershipShared is the per-lead opt-in for the partner shared-content
          feature: when true, this lead is exposed (privacy-projected) to partner
          companies whose active partnership grants the `leads` view scope.

          NOTE: the Lead struct is otherwise bson-tagged only, so json.Marshal
          stores every other field under its Go field name (PascalCase). This
          field carries an explicit json tag so it is persisted under the
          lowercase `partnership_shared` key — the key the shared-leads query
          (metadata->>'partnership_shared') and the cross-tenant repo both read.
        type: boolean
      passwordHash:
        type: string
      phone:
        type: string
      propertyIDs:
        items:
          type: string
        type: array
      propertyInterest:
        $ref: '#/definitions/github_com_oginoino_toca_toca-crm_internal_domain_lead.LeadProperty'
      qualification:
        additionalProperties: true
        type: object
      recommended_property_id:
        description: |-
          RecommendedPropertyID é o imóvel que o corretor recomenda ao cliente
          (exibido no portal como "Sugestão do seu corretor").
        type: string
      recommended_property_snapshot:
        allOf:
        - $ref: '#/definitions/github_com_oginoino_toca_toca-crm_internal_domain_lead.RecommendedPropertySnapshot'
        description: |-
          RecommendedPropertySnapshot guarda um resumo do imóvel recomendado
          (título/localização/valor) para o portal exibir sem depender do token
          do cliente acessar o core.
      role:
        allOf:
        - $ref: '#/definitions/github_com_oginoino_toca_toca-crm_internal_domain_lead.ClientRole'
        description: owner, buyer, tenant, guarantor
      rouletteRetries:
        type: integer
      slaretries:
        additionalProperties:
          type: integer
        description: SLA retries por tier_id (controla redirecionamentos automáticos)
        type: object
      source:
        $ref: '#/definitions/github_com_oginoino_toca_toca-crm_internal_domain_lead.LeadSource'
      status:
        $ref: '#/definitions/github_com_oginoino_toca_toca-crm_internal_domain_lead.LeadStatus'
      tenantID:
        type: string
      updatedAt:
        type: string
      updatedSeq:
        type: integer
      visit_operation:
        allOf:
        - $ref: '#/definitions/github_com_oginoino_toca_toca-crm_internal_domain_lead.VisitOperation'
        description: |-
          VisitRequest guarda a solicitação de visita do cliente para o imóvel
          recomendado (agendamento por lead, sem depender de negócio).
      visit_request:
        $ref: '#/definitions/github_com_oginoino_toca_toca-crm_internal_domain_lead.VisitRequest'
    required:
    - email
    - id
    - name
    - phone
    - source
    - status
    type: object
