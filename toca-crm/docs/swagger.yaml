    - weighted
    - priority
    type: string
    x-enum-varnames:
    - DistMethodSequential
    - DistMethodLoadBalance
    - DistMethodWeighted
    - DistMethodPriority
  github_com_oginoino_toca_toca-crm_internal_domain_lead.EscalationStep:
