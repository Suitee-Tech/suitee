        type: number
      available_for:
        items:
          type: string
        type: array
      bathrooms:
        type: integer
      bedrooms:
        description: |-
          Features — só os campos do score (bedrooms) + extras para
          render no card de sugestão (bathrooms, parking).
        type: integer
      city:
        type: string
      condo_fee:
        type: number
      display_id:
        type: string
      id:
        type: string
      listing_type:
        type: string
      media_images:
        items:
          type: string
        type: array
      neighborhood:
        type: string
      parking_spaces:
        type: integer
      property_type:
        type: string
      rent_price:
        type: number
      sale_price:
        description: |-
          Pricing — só os "current_amount" que importam pro score.
          Pode vir 0 quando o imóvel não tem o preço daquele tipo (ex.: só locação).
        type: number
      state:
        type: string
      status:
        type: string
      street:
        description: Address — flat para facilitar matching/render.
        type: string
      thumbnail_url:
        description: |-
          Media — só a thumbnail principal. O frontend pode pedir mais
          fotos via GET /properties/:id quando o usuário clicar no card.
        type: string
      title:
        type: string
    type: object
  exports.Format:
    enum:
    - csv
    - pdf
    type: string
    x-enum-varnames:
    - FormatCSV
    - FormatPDF
  exports.Job:
    properties:
      completed_at:
        type: string
      created_at:
        description: |-
          Timestamps separados pro frontend distinguir "queued há 30s"
          vs "started há 5min" vs "done há 10min".
        type: string
      entity_type:
        type: string
      error_message:
        type: string
      filters:
        additionalProperties: true
        description: shape definido pelo Generator
        type: object
      format:
