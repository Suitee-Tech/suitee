  github_com_oginoino_toca_toca-crm_internal_domain_lead.ClientRole:
    enum:
    - owner
    - buyer
    - tenant
    - guarantor
    type: string
    x-enum-comments:
      ClientRoleBuyer: Comprador
      ClientRoleGuarantor: Fiador
      ClientRoleOwner: Proprietário (owner of a property)
      ClientRoleTenant: Inquilino
    x-enum-descriptions:
    - Proprietário (owner of a property)
    - Comprador
    - Inquilino
    - Fiador
    x-enum-varnames:
    - ClientRoleOwner
    - ClientRoleBuyer
    - ClientRoleTenant
    - ClientRoleGuarantor
  github_com_oginoino_toca_toca-crm_internal_domain_lead.DistMethod:
