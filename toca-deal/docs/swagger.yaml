        required: true
        type: string
      - description: Counter-offer acceptance
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_api_v1_handlers.AcceptCounterOfferRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: proposal_id required
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: tenant context required
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: deal or proposal not found
          schema:
            $ref: '#/definitions/response.Response'
        "409":
          description: proposal is not in COUNTER_OFFER status
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
