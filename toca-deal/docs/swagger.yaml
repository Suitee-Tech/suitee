basePath: /api/v1
definitions:
  audit.LogEntry:
    properties:
      action:
        type: string
      actor_id:
        type: string
      actor_type:
        type: string
      after:
        additionalProperties: {}
        type: object
      before:
        additionalProperties: {}
        type: object
      created_at:
        type: string
      entity_id:
        type: string
      entity_type:
        type: string
      id:
        type: string
      metadata:
        additionalProperties: {}
        type: object
      tenant_id:
        type: string
    type: object
  github_com_oginoino_toca_toca-deal_internal_domain_contract.AdjustmentEntry:
    properties:
      applied_at:
        type: string
      effective_from:
        type: string
      index_name:
        type: string
      index_value:
        type: number
      mode:
        description: Mode é "manual" ou "auto"; preserva a origem do reajuste para
          auditoria.
        type: string
      new_value:
        type: number
      note:
        type: string
      previous_value:
        type: number
      triggered_by:
        type: string
    type: object
  github_com_oginoino_toca_toca-deal_internal_domain_contract.AmendmentEntry:
    properties:
      created_at:
        type: string
      new_contract_id:
        type: string
      reason:
        type: string
      superseded_at:
        description: |-
          SupersededAt é preenchido quando o aditivo é assinado e o contrato
          original passa para EXPIRED. Antes disso fica vazio.
        type: string
      triggered_by:
        type: string
    type: object
  github_com_oginoino_toca_toca-deal_internal_domain_contract.Contract:
    properties:
      adjust_index:
        type: string
      adjustments:
        description: Adjustments mantém o histórico de reajustes aplicados (manual
          ou auto).
        items:
          $ref: '#/definitions/github_com_oginoino_toca_toca-deal_internal_domain_contract.AdjustmentEntry'
        type: array
      amendments:
        description: |-
          Amendments lista aditivos emitidos a partir deste contrato. Apenas no
          contrato original — o aditivo (novo contrato) carrega apenas
          AmendsContractID apontando de volta. Ordem cronológica.
        items:
          $ref: '#/definitions/github_com_oginoino_toca_toca-deal_internal_domain_contract.AmendmentEntry'
        type: array
      amends_contract_id:
        description: |-
          AmendsContractID, quando preenchido, indica que ESTE contrato é um
          aditivo de outro — substitui o original ao ser assinado. O original
          passa para EXPIRED e ganha SupersededAt no AmendmentEntry correspondente.
        type: string
      auto_adjust:
        type: boolean
      client:
        type: string
      commission_pct:
        type: number
      content:
        description: Could be HTML or S3 URL
        type: string
      created_at:
        type: string
      customer_id:
        description: |-
          CustomerID mirrors Deal.CustomerID (the lead/customer party UUID) so
          the listing UI can fall back to a CRM lookup when Client (the cached
          display name) drifts after a lead rename. Snapshot-derived from the
          Deal at CreateContract time.
        type: string
      deal_id:
        type: string
      display_id:
        type: string
      draft_revisions:
        description: |-
          DraftRevisions preserves the document replaced by each regeneration.
          Signature attempts remain linked to this same contract.
        items:
          $ref: '#/definitions/github_com_oginoino_toca_toca-deal_internal_domain_contract.DraftRevision'
        type: array
      end_date:
        type: string
      entry_inspection_id:
        description: |-
          EntryInspectionID is set when the ENTRY vistoria created at
          contract.signed time is concluded with a laudo. Mirrors
          Termination.ExitInspectionID — both are the inspection ids that
          flank the rental's operational window. Empty until the operator
          closes the entry inspection in toca-ops.
        type: string
      external_envelope_id:
        description: |-
          External signature integration (Clicksign today; provider-agnostic).
          Populated when SendForSignature is called; cleared after a successful
          cancel/refusal so the contract is editable again.
        type: string
      id:
        type: string
      late_fee_pct:
        description: |-
          Per-contract financial rules. When set, override the global delinquency
          defaults (2% multa / 1% juros mês) so the admin UI can tune them per
          contract. Stored on the contract itself rather than on a separate config
          so they survive renewals/re-signatures of the same lease.
        type: number
      monthly_interest_pct:
        type: number
      next_adjustment:
        type: string
      property_id:
        type: string
      property_title:
        type: string
      security_deposit:
        description: |-
          SecurityDeposit (caução) — valor depositado pelo locatário no início do
          contrato. Usado pelo TerminateContract para acertar devolução.
        type: number
      sent_for_signature_at:
        type: string
      signatories:
        items:
          $ref: '#/definitions/github_com_oginoino_toca_toca-deal_internal_domain_contract.Signatory'
        type: array
      signature_locked_at:
        description: |-
          SignatureLockedAt blocks edits while an envelope is in flight. Cleared
          when the envelope is canceled or refused. SIGNED contracts stay locked
          permanently — that's intentional, you can't edit a signed contract.
        type: string
      signature_provider:
        description: e.g. "clicksign"
        type: string
      signed_document_url:
        description: |-
          SignedDocumentURL is the URL of the final signed PDF, populated by
          MarkSignedExternally from the SignatureEnvelopeFinishedEvent.
        type: string
      start_date:
        type: string
      status:
        $ref: '#/definitions/github_com_oginoino_toca_toca-deal_internal_domain_contract.Status'
      tenant_id:
        type: string
      termination:
        allOf:
        - $ref: '#/definitions/github_com_oginoino_toca_toca-deal_internal_domain_contract.Termination'
        description: Termination é preenchido pelo TerminateContract — nil enquanto
          ativo.
      type:
        allOf:
        - $ref: '#/definitions/github_com_oginoino_toca_toca-deal_internal_domain_contract.ContractType'
        description: CRM contract fields
      updated_at:
        type: string
      value:
        type: number
    type: object
  github_com_oginoino_toca_toca-deal_internal_domain_contract.ContractType:
    enum:
    - venda
    - locacao
    type: string
    x-enum-varnames:
    - TypeVenda
    - TypeLocacao
  github_com_oginoino_toca_toca-deal_internal_domain_contract.CreateContractRequest:
    properties:
      adjust_index:
        type: string
      auto_adjust:
        type: boolean
      client:
        type: string
      commission_pct:
        type: number
      content:
        type: string
      customer_id:
        description: |-
          CustomerID is accepted but optional — CreateContract overrides it from
          the linked Deal (authoritative source) so a stale/missing value from
          the caller cannot poison the snapshot.
        type: string
      deal_id:
        type: string
      end_date:
        type: string
      late_fee_pct:
        type: number
      monthly_interest_pct:
        type: number
      next_adjustment:
        type: string
      property_id:
        type: string
      property_title:
        type: string
      signatories:
        items:
          $ref: '#/definitions/github_com_oginoino_toca_toca-deal_internal_domain_contract.Signatory'
        type: array
      start_date:
        type: string
      status:
        $ref: '#/definitions/github_com_oginoino_toca_toca-deal_internal_domain_contract.Status'
      type:
        allOf:
        - $ref: '#/definitions/github_com_oginoino_toca_toca-deal_internal_domain_contract.ContractType'
        description: CRM fields
      value:
        type: number
    type: object
  github_com_oginoino_toca_toca-deal_internal_domain_contract.DraftRevision:
    properties:
      content:
        type: string
      replaced_at:
        type: string
      replaced_by:
        type: string
      signatories:
        items:
          $ref: '#/definitions/github_com_oginoino_toca_toca-deal_internal_domain_contract.Signatory'
        type: array
    type: object
  github_com_oginoino_toca_toca-deal_internal_domain_contract.Signatory:
    properties:
      auth_methods:
        description: selected by the operator
        items:
          type: string
        type: array
      birthday:
        description: YYYY-MM-DD
        type: string
      clicksign_signer_key:
        description: |-
          External signature integration. Populated by EnvelopeService.CreateForContract
          (via the Clicksign client) and updated by MarkSignerSignedExternally.
        type: string
      documentation:
        description: CPF/CNPJ
        type: string
      email:
        type: string
      evidence_url:
        type: string
      group:
        description: |-
          Group is the default Clicksign signing-order group for this signer.
          0 / unset keeps the legacy behavior (every signer notified together
          on envelope activation). Per-envelope overrides at create time take
          precedence — this is just the contract-level default.
        type: integer
      id:
        type: string
      name:
        type: string
      phone_number:
        description: |-
          Optional contact + identification used by the signature provider
          (Clicksign requires CPF for some auth methods like icp_brasil/biometric).
        type: string
      role:
        allOf:
        - $ref: '#/definitions/github_com_oginoino_toca_toca-deal_internal_domain_contract.SignatoryRole'
        description: Buyer, Seller, Witness
      signature:
        description: Digital signature hash
        type: string
      signed_at:
        type: string
      status:
        allOf:
        - $ref: '#/definitions/github_com_oginoino_toca_toca-deal_internal_domain_contract.SignatoryStatus'
        description: Mirrors envelope SignerStatus — written by signature_subscribers
      viewed_at:
        description: First time the signer opened the signing link
        type: string
    type: object
  github_com_oginoino_toca_toca-deal_internal_domain_contract.SignatoryRole:
    enum:
    - inquilino
    - proprietario
    - fiador
    - locador
    - locatario
    - comprador
    - vendedor
    - avalista
    - testemunha
    - conjuge
    - procurador
    - representante_legal
    - tutor
    - curador
    type: string
    x-enum-varnames:
    - RoleInquilino
    - RoleProprietario
    - RoleFiador
    - RoleLocador
    - RoleLocatario
    - RoleComprador
    - RoleVendedor
    - RoleAvalista
    - RoleTestemunha
    - RoleConjuge
    - RoleProcurador
    - RoleRepresentanteLegal
    - RoleTutor
    - RoleCurador
  github_com_oginoino_toca_toca-deal_internal_domain_contract.SignatoryStatus:
    enum:
    - PENDING
    - VIEWED
    - SIGNED
    - REFUSED
    type: string
    x-enum-varnames:
    - SignatoryStatusPending
    - SignatoryStatusViewed
    - SignatoryStatusSigned
    - SignatoryStatusRefused
  github_com_oginoino_toca_toca-deal_internal_domain_contract.Status:
    enum:
    - DRAFT
    - PENDING_SIGNATURE
    - PARTIALLY_SIGNED
    - SIGNED
    - ACTIVE
    - EXPIRED
    - TERMINATED
    type: string
    x-enum-varnames:
    - StatusDraft
    - StatusPending
    - StatusPartiallySigned
    - StatusSigned
    - StatusActive
    - StatusExpired
    - StatusTerminated
  github_com_oginoino_toca_toca-deal_internal_domain_contract.Termination:
    properties:
      early_termination_fee:
        type: number
      exit_inspection_id:
        type: string
      reason:
        type: string
      security_deposit_deductions:
        type: number
      security_deposit_return:
        type: number
      terminated_at:
        type: string
      triggered_by:
        type: string
    type: object
  github_com_oginoino_toca_toca-deal_internal_domain_contract.TerminationFeeBreakdown:
    properties:
      cap_applied:
        description: |-
          CapApplied — true quando a fórmula bruta excederia o teto de 3
          alugueis (Lei 8245/91 Art. 4) e foi clipada. Não acontece com a
          fórmula linear pura, mas defendemos contra extensões futuras.
        type: boolean
      fee_cents:
        description: |-
          FeeCents — valor da multa em centavos. Sempre >= 0. Centavos para
          evitar erro de ponto flutuante em soma de cobranças.
        type: integer
      fraction_remaining:
        description: FractionRemaining — MonthsRemaining / TotalMonths, em [0, 1].
        type: number
      monthly_rent_cents:
        description: MonthlyRentCents — aluguel mensal usado no cálculo.
        type: integer
      months_elapsed:
        description: MonthsElapsed — meses já cumpridos (corrigido para min(elapsed,
          total)).
        type: integer
      months_remaining:
        description: MonthsRemaining — meses restantes (TotalMonths - MonthsElapsed).
        type: integer
      reason:
        description: |-
          Reason — string curta para UI explicar zeros: "contract_already_ended",
          "exempt_no_monthly_rent", etc. Vazia no caminho feliz.
        type: string
      total_months:
        description: TotalMonths — duração total contratada.
        type: integer
    type: object
  github_com_oginoino_toca_toca-deal_internal_domain_deal.BrokerParticipation:
    properties:
      broker_id:
        type: string
      commission:
        description: commission amount
        type: number
      percentage:
        description: commission split %
        type: number
      role:
        $ref: '#/definitions/github_com_oginoino_toca_toca-deal_internal_domain_deal.BrokerParticipationRole'
    type: object
  github_com_oginoino_toca_toca-deal_internal_domain_deal.BrokerParticipationRole:
    enum:
    - captador
    - co_captador
    - visitador
    - atendente
    - fechamento
    - imobiliaria
    type: string
    x-enum-comments:
      BrokerRoleCaptador: property capture broker
      BrokerRoleFechamento: deal closing broker
      BrokerRoleVisitador: visit broker
    x-enum-descriptions:
    - property capture broker
    - ""
    - visit broker
    - ""
    - deal closing broker
    - ""
    x-enum-varnames:
    - BrokerRoleCaptador
    - BrokerRoleCoCaptador
    - BrokerRoleVisitador
    - BrokerRoleAtendente
    - BrokerRoleFechamento
    - BrokerRoleImobiliaria
  github_com_oginoino_toca_toca-deal_internal_domain_deal.ChecklistItem:
    properties:
      category:
        $ref: '#/definitions/github_com_oginoino_toca_toca-deal_internal_domain_deal.ChecklistItemCategory'
      content_type:
        type: string
      description:
        type: string
      file_name:
        type: string
      file_size:
        type: integer
      file_url:
        type: string
      id:
        type: string
      name:
        type: string
      party_id:
        type: string
      rejection_reason:
        type: string
      request_mode:
        allOf:
        - $ref: '#/definitions/github_com_oginoino_toca_toca-deal_internal_domain_deal.ChecklistItemRequestMode'
        description: |-
          RequestMode define se o cliente anexa arquivo ("upload") ou apenas
          preenche o formulário ("form"). Vazio é normalizado para "upload".
      requested_fields:
        items:
          $ref: '#/definitions/github_com_oginoino_toca_toca-deal_internal_domain_deal.ChecklistRequestedField'
        type: array
      required:
        type: boolean
      reviewed_at:
        type: string
      solicited:
        type: boolean
      solicited_at:
        type: string
      status:
        $ref: '#/definitions/github_com_oginoino_toca_toca-deal_internal_domain_deal.ChecklistItemStatus'
      storage_key:
        type: string
      uploaded_at:
        type: string
      uploaded_by:
        type: string
    type: object
  github_com_oginoino_toca_toca-deal_internal_domain_deal.ChecklistItemCategory:
    enum:
    - pessoal
    - financeiro
    - imovel
    - juridico
    - outros
    type: string
    x-enum-varnames:
    - CategoryPessoal
    - CategoryFinanceiro
    - CategoryImovel
    - CategoryJuridico
    - CategoryOutros
  github_com_oginoino_toca_toca-deal_internal_domain_deal.ChecklistItemRequestMode:
    enum:
    - upload
    - form
    type: string
    x-enum-varnames:
    - RequestModeUpload
    - RequestModeForm
  github_com_oginoino_toca_toca-deal_internal_domain_deal.ChecklistItemStatus:
    enum:
    - PENDING
    - UPLOADED
    - APPROVED
    - REJECTED
    type: string
    x-enum-varnames:
    - ChecklistPending
    - ChecklistUploaded
    - ChecklistApproved
    - ChecklistRejected
  github_com_oginoino_toca_toca-deal_internal_domain_deal.ChecklistRequestedField:
    properties:
      key:
        type: string
      label:
        type: string
      required:
        type: boolean
      type:
        type: string
    type: object
  github_com_oginoino_toca_toca-deal_internal_domain_deal.ChecklistStats:
    properties:
      approved:
        type: integer
      pending:
        type: integer
      rejected:
        type: integer
      required:
        type: integer
      required_approved:
        type: integer
      required_complete:
        type: boolean
      total:
        type: integer
      uploaded:
        type: integer
    type: object
  github_com_oginoino_toca_toca-deal_internal_domain_deal.ChecklistTemplate:
    properties:
      id:
        type: string
      items:
        items:
          $ref: '#/definitions/github_com_oginoino_toca_toca-deal_internal_domain_deal.ChecklistTemplateItem'
        type: array
      label:
        type: string
    type: object
  github_com_oginoino_toca_toca-deal_internal_domain_deal.ChecklistTemplateItem:
    properties:
      category:
        $ref: '#/definitions/github_com_oginoino_toca_toca-deal_internal_domain_deal.ChecklistItemCategory'
      description:
        type: string
      name:
        type: string
      request_mode:
        allOf:
        - $ref: '#/definitions/github_com_oginoino_toca_toca-deal_internal_domain_deal.ChecklistItemRequestMode'
        description: |-
          RequestMode (opcional): "form" = apenas preenchimento de formulário
          (sem anexo) — ex.: CPF e telefone digitados. Vazio = "upload".
      requested_fields:
        description: |-
          RequestedFields (opcional) são os campos solicitados ao cliente
          quando RequestMode = "form" (ou complemento do anexo).
        items:
          $ref: '#/definitions/github_com_oginoino_toca_toca-deal_internal_domain_deal.ChecklistRequestedField'
        type: array
      required:
        type: boolean
    type: object
  github_com_oginoino_toca_toca-deal_internal_domain_deal.Deal:
    properties:
      broker_id:
        description: Primary responsible broker
        type: string
      broker_participations:
        description: |-
          BrokerParticipations tracks all brokers involved (captador, visitador, fechamento)
          for history and commission split purposes
        items:
          $ref: '#/definitions/github_com_oginoino_toca_toca-deal_internal_domain_deal.BrokerParticipation'
        type: array
      checklist:
        items:
          $ref: '#/definitions/github_com_oginoino_toca_toca-deal_internal_domain_deal.ChecklistItem'
        type: array
      checklist_stats:
        allOf:
        - $ref: '#/definitions/github_com_oginoino_toca_toca-deal_internal_domain_deal.ChecklistStats'
        description: |-
          ChecklistStats is a derived view of `Checklist` populated by
          callers (see `PopulateChecklistStats`) before serialization. Tagged
          `bson:"-"` so the repository never persists it — the source of
          truth is the items themselves. Surfaced on GetByID so the Esteira
          Documentation tab can render a "X de Y obrigatórios aprovados"
          badge without re-computing client-side.
      co_brokering:
        type: boolean
      commission:
        type: number
      created_at:
        type: string
      customer_id:
        description: |-
          CustomerID is ALWAYS the lead.id of the buyer or tenant. Stays constant
          across the lead→client lifecycle. To get the portal account, look up
          the lead's `account_id` field via toca-crm — don't reuse this column
          for that purpose.
        type: string
      display_id:
        type: string
      documents:
        items:
          $ref: '#/definitions/github_com_oginoino_toca_toca-deal_internal_domain_deal.Document'
        type: array
      due_diligence:
        $ref: '#/definitions/github_com_oginoino_toca_toca-deal_internal_domain_deal.DueDiligence'
      favorites:
        items:
          $ref: '#/definitions/github_com_oginoino_toca_toca-deal_internal_domain_deal.Favorite'
        type: array
      history:
        items:
          $ref: '#/definitions/github_com_oginoino_toca_toca-deal_internal_domain_deal.History'
        type: array
      id:
        type: string
      idempotency_key:
        description: |-
          IdempotencyKey identifica a INTENÇÃO de criação: o mesmo formulário
          reenviado (duplo clique, retry de rede) usa a mesma chave e o backend
          devolve o negócio já criado em vez de duplicar. Vazio em negócios
          criados por clientes sem a chave.
        type: string
      lead_id:
        description: |-
          LeadID is kept for explicit lead↔customer separation. Defaults to
          CustomerID; in pre-conversion deals they're identical. Useful when a
          deal is later transferred between leads (rare).
        type: string
      owner_id:
        description: |-
          OwnerID is the lead.id of the property owner (lead with role='owner').
          It does NOT change after lead→client conversion — `account_id` is a
          projection layered onto the same lead, not a replacement for the id.
        type: string
      parties:
        items:
          $ref: '#/definitions/github_com_oginoino_toca_toca-deal_internal_domain_deal.Party'
        type: array
      property_id:
        type: string
      proposals:
        items:
          $ref: '#/definitions/github_com_oginoino_toca_toca-deal_internal_domain_deal.Proposal'
        type: array
      recommended_property_id:
        description: |-
          RecommendedPropertyID é o imóvel que o corretor recomenda explicitamente
          ao cliente (exibido no portal como "Sugestão do seu corretor").
        type: string
      signers:
        items:
          $ref: '#/definitions/github_com_oginoino_toca_toca-deal_internal_domain_deal.Signer'
        type: array
      source_company_id:
        description: |-
          SourceCompanyID is the tenant that OWNS the shared resource the deal
          was started from. Only set when CoBrokering is true. Lets the Esteira
          and the financial split identify the owner company.
        type: string
      status:
        $ref: '#/definitions/github_com_oginoino_toca_toca-deal_internal_domain_deal.Status'
      tenant_id:
        type: string
      type:
        $ref: '#/definitions/github_com_oginoino_toca_toca-deal_internal_domain_deal.Type'
      updated_at:
        type: string
      value:
        type: number
    required:
    - broker_id
    - customer_id
    - owner_id
    - property_id
    - status
    - tenant_id
    - type
    type: object
  github_com_oginoino_toca_toca-deal_internal_domain_deal.Document:
    properties:
      deal_id:
        type: string
      description:
        type: string
      id:
        type: string
      status:
        $ref: '#/definitions/github_com_oginoino_toca_toca-deal_internal_domain_deal.DocumentStatus'
      type:
        $ref: '#/definitions/github_com_oginoino_toca_toca-deal_internal_domain_deal.DocumentType'
      uploaded_at:
        type: string
      uploaded_by:
        type: string
      url:
        type: string
    type: object
  github_com_oginoino_toca_toca-deal_internal_domain_deal.DocumentStatus:
    enum:
    - PENDING
    - UPLOADED
    - APPROVED
    - REJECTED
    type: string
    x-enum-varnames:
    - DocumentStatusPending
    - DocumentStatusUploaded
    - DocumentStatusApproved
    - DocumentStatusRejected
  github_com_oginoino_toca_toca-deal_internal_domain_deal.DocumentType:
    enum:
    - IDENTITY
    - INCOME
    - RESIDENCE
    - PROPERTY
    - CONTRACT
    - SIGNED_CONTRACT
    - OTHER
    type: string
    x-enum-comments:
      DocumentTypeContract: Minuta do Contrato
      DocumentTypeIdentity: RG, CPF
      DocumentTypeIncome: Comprovante de Renda
