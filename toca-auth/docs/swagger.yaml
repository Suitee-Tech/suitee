basePath: /api/v1
definitions:
  github_com_oginoino_toca-auth_internal_api_v1_dto.AccountResponse:
    properties:
      company:
        $ref: '#/definitions/github_com_oginoino_toca-auth_internal_api_v1_dto.CompanyResponse'
      created_at:
        type: string
      id:
        type: string
      individual:
        $ref: '#/definitions/github_com_oginoino_toca-auth_internal_api_v1_dto.UserResponse'
      type:
        type: string
      updated_at:
        type: string
    type: object
  github_com_oginoino_toca-auth_internal_api_v1_dto.CompanyMember:
    properties:
      account_id:
        type: string
      profile:
        type: string
    type: object
  github_com_oginoino_toca-auth_internal_api_v1_dto.CompanyResponse:
    properties:
      address:
        $ref: '#/definitions/github_com_oginoino_toca-auth_internal_domain_company.Address'
      email:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      legal_name:
        type: string
      members:
        items:
          $ref: '#/definitions/github_com_oginoino_toca-auth_internal_api_v1_dto.CompanyMember'
        type: array
      name:
        type: string
      owner_id:
        type: string
      phone:
        type: string
      tax_id:
        type: string
      type:
        type: string
    type: object
  github_com_oginoino_toca-auth_internal_api_v1_dto.UpdateCompanyRequest:
    properties:
      address:
        properties:
          city:
            type: string
          complement:
            type: string
          district:
            type: string
          number:
            type: string
          state:
            type: string
          street:
            type: string
          zip_code:
            type: string
        required:
        - city
        - district
        - number
        - state
        - street
        - zip_code
        type: object
      email:
        type: string
      legal_name:
        type: string
      name:
        type: string
      phone:
        type: string
      tax_id:
        type: string
      type:
        type: string
    required:
    - address
    - email
    - legal_name
    - name
    - phone
    - tax_id
    type: object
  github_com_oginoino_toca-auth_internal_api_v1_dto.UserResponse:
    properties:
      address:
        $ref: '#/definitions/github_com_oginoino_toca-auth_internal_domain_user.Address'
      avatar_url:
        type: string
      banking:
        allOf:
        - $ref: '#/definitions/github_com_oginoino_toca-auth_internal_domain_user.BankingInfo'
        description: |-
          Banking exposed via GET /auth/me para que o portal e o admin
          renderizem o formulário pré-preenchido. PATCH /auth/me aceita
          updates via UpdateMeRequest.Banking. Issue #463.
      bio:
        type: string
      email:
        type: string
      firstname:
        type: string
      fullname:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      lastname:
        type: string
      notifications:
        $ref: '#/definitions/github_com_oginoino_toca-auth_internal_domain_user.Notifications'
      phone:
        type: string
      role:
        type: string
    type: object
  github_com_oginoino_toca-auth_internal_domain_auth.AddUserRequest:
    properties:
      account_id:
        type: string
      email:
        type: string
      firstname:
        type: string
      lastname:
        type: string
      password:
        minLength: 8
        type: string
      profile:
        description: company access level (e.g. admin, manager)
        type: string
      role:
        description: functional role (e.g. broker, staff)
        type: string
    required:
    - email
    - firstname
    - lastname
    - password
    type: object
  github_com_oginoino_toca-auth_internal_domain_auth.CreateCompanyRequest:
    properties:
      address:
        properties:
          city:
            type: string
          complement:
            type: string
          district:
            type: string
          number:
            type: string
          state:
            type: string
          street:
            type: string
          zip_code:
            type: string
        required:
        - city
        - district
        - number
        - state
        - street
        - zip_code
        type: object
      email:
        type: string
      legal_name:
        type: string
      name:
        type: string
      phone:
        type: string
      tax_id:
        type: string
      type:
        description: franchisor, franchisee
        type: string
    required:
    - address
    - email
    - legal_name
    - name
    - phone
    - tax_id
    type: object
  github_com_oginoino_toca-auth_internal_domain_auth.ForgotPasswordRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  github_com_oginoino_toca-auth_internal_domain_auth.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  github_com_oginoino_toca-auth_internal_domain_auth.RefreshTokenRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  github_com_oginoino_toca-auth_internal_domain_auth.RegisterRequest:
    properties:
      bio:
        type: string
      company_name:
        description: For Company
        type: string
      confirm_password:
        type: string
      email:
        type: string
      firstname:
        description: For Individual
        type: string
      lastname:
        type: string
      password:
        minLength: 8
        type: string
      phone:
        type: string
      role:
        description: Functional role (e.g. Administrador, Corretor, Gerente)
        type: string
      tax_id:
        type: string
      type:
        enum:
        - individual
        - company
        type: string
    required:
    - confirm_password
    - email
    - password
    - type
    type: object
  github_com_oginoino_toca-auth_internal_domain_auth.ResetPasswordWithSessionRequest:
    properties:
      access_token:
        type: string
      new_password:
        minLength: 8
        type: string
      refresh_token:
        type: string
    required:
    - access_token
    - new_password
    - refresh_token
    type: object
  github_com_oginoino_toca-auth_internal_domain_auth.TokenPair:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  github_com_oginoino_toca-auth_internal_domain_auth.UpdateMemberRequest:
    properties:
      functional_role:
        description: FunctionalRole é o papel de catálogo (admin, gestor, corretor,
          ...).
        type: string
      is_active:
        description: IsActive — nil não mexe; false suspende o vínculo; true reativa.
        type: boolean
      profile:
        description: Profile é o nível de acesso na empresa (member, viewer, admin).
        type: string
    type: object
  github_com_oginoino_toca-auth_internal_domain_company.Address:
    properties:
      city:
        type: string
      complement:
        type: string
      district:
        type: string
      number:
        type: string
      state:
        type: string
      street:
        type: string
      zip_code:
        type: string
    required:
    - city
    - district
    - number
    - state
    - street
    - zip_code
    type: object
  github_com_oginoino_toca-auth_internal_domain_invitation.AcceptInvitationRequest:
    properties:
      token:
        type: string
    required:
    - token
    type: object
  github_com_oginoino_toca-auth_internal_domain_invitation.CreateInvitationRequest:
    properties:
      email:
        type: string
      group_ids:
        items:
          type: string
        type: array
      role:
        type: string
    required:
    - email
    type: object
  github_com_oginoino_toca-auth_internal_domain_invitation.Invitation:
    properties:
      company_id:
        type: string
      created_at:
        type: string
      created_by:
        type: string
      email:
        type: string
      expires_at:
        type: string
      group_ids:
        description: Groups to join upon accepting
        items:
          type: string
        type: array
      id:
        type: string
      role:
        description: staff, manager, admin
        type: string
      status:
        description: pending, accepted, expired
        type: string
      token:
        description: unique token for invite link
        type: string
    required:
    - company_id
    - email
    - role
    type: object
  github_com_oginoino_toca-auth_internal_domain_user.Address:
    properties:
      city:
        type: string
      complement:
        type: string
      district:
        type: string
      number:
        type: string
      state:
        type: string
      street:
        type: string
      zip_code:
        type: string
    type: object
  github_com_oginoino_toca-auth_internal_domain_user.BankAccountType:
    enum:
    - checking
    - savings
    type: string
    x-enum-varnames:
    - BankAccountTypeChecking
    - BankAccountTypeSavings
  github_com_oginoino_toca-auth_internal_domain_user.BankingInfo:
    properties:
      account:
        type: string
      account_digit:
        type: string
      account_type:
        allOf:
        - $ref: '#/definitions/github_com_oginoino_toca-auth_internal_domain_user.BankAccountType'
        description: AccountType — corrente ou poupança.
      agency:
        description: |-
          Agência — só dígitos, sem dígito verificador (o BR não tem padrão
          uniforme — alguns bancos têm 4 dígitos, outros 5; alguns têm
          DV, outros não — não validamos aqui).
        type: string
      agency_digit:
        type: string
      bank_code:
        description: |-
          Banco — código compe (3 dígitos, ex.: 341 Itaú) ou ISPB (8
          dígitos para participantes do SPB que não têm compe).
          Mantemos como string porque alguns bancos digitais usam ISPB.
        type: string
      bank_name:
        type: string
      holder_document:
        type: string
      holder_name:
        description: |-
          Holder — titular da conta. Quando vazio, assumimos que é o
          próprio usuário (FullName). Document é CPF (PF) ou CNPJ (PJ).
        type: string
      pix_key:
        type: string
      pix_key_type:
        allOf:
        - $ref: '#/definitions/github_com_oginoino_toca-auth_internal_domain_user.PixKeyType'
        description: |-
          PIX — chave de transferência instantânea. Tipo separado do valor
          porque a validação muda por tipo (CPF vs. email vs. EVP).
    type: object
  github_com_oginoino_toca-auth_internal_domain_user.Notifications:
    properties:
      email:
        type: boolean
      push:
        type: boolean
      sms:
        type: boolean
    type: object
  github_com_oginoino_toca-auth_internal_domain_user.PixKeyType:
    enum:
    - cpf
    - cnpj
    - email
    - phone
    - evp
    type: string
    x-enum-comments:
      PixKeyTypeEVP: chave aleatória (UUID v4)
    x-enum-descriptions:
    - ""
    - ""
    - ""
    - ""
    - chave aleatória (UUID v4)
    x-enum-varnames:
    - PixKeyTypeCPF
    - PixKeyTypeCNPJ
    - PixKeyTypeEmail
    - PixKeyTypePhone
    - PixKeyTypeEVP
  internal_api_v1_handlers.CompanyLookupResponse:
    properties:
      city:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      legal_name:
        type: string
      name:
        type: string
      state:
        type: string
      tax_id:
        type: string
      type:
        type: string
    type: object
  internal_api_v1_handlers.DeleteMyAccountRequest:
    properties:
      confirm:
        description: |-
          Confirm — texto literal "EXCLUIR MINHA CONTA" exigido pelo
          frontend. Backend re-valida pra impedir bypass.
        type: string
      reason:
        description: |-
          Reason — motivo livre. Opcional mas LGPD exige rastrear pra que
          possamos identificar padrões (ex.: bug específico levando users
          a sair).
        type: string
    required:
    - confirm
    type: object
  internal_api_v1_handlers.PersonalDataResponse:
    properties:
      companies:
        description: Companies — empresas que o usuário pertence (membership).
        items:
          $ref: '#/definitions/github_com_oginoino_toca-auth_internal_api_v1_dto.CompanyResponse'
        type: array
      generated_at:
        description: Generated — quando o snapshot foi montado (UTC RFC3339).
        type: string
      identity:
        allOf:
        - $ref: '#/definitions/github_com_oginoino_toca-auth_internal_api_v1_dto.UserResponse'
        description: Identity — dados de cadastro mantidos pelo toca-auth.
      notice:
        description: Notice — disclaimer LGPD com link para política completa.
        type: string
      other_data_sources:
        description: |-
          OtherDataSources — referência para dados que vivem em outros
          services. UI pode renderizar instruções ao usuário sobre como
          acessar (ex.: export async #474, contato com DPO etc.).
        items:
          $ref: '#/definitions/internal_api_v1_handlers.dataSourceRef'
        type: array
      preferences:
        allOf:
        - $ref: '#/definitions/internal_api_v1_handlers.preferencesSection'
        description: Preferences — preferências + consentimentos LGPD (Art. 8).
    type: object
  internal_api_v1_handlers.dataSourceRef:
    properties:
      description:
        type: string
      how_to_access:
        type: string
      service:
        type: string
    type: object
  internal_api_v1_handlers.preferencesSection:
    properties:
      consent:
        additionalProperties: true
        type: object
      date_format:
        type: string
      language:
        type: string
      timezone:
        type: string
    type: object
  response.PaginationMeta:
    properties:
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
      totalPages:
        type: integer
    type: object
  response.Response:
    properties:
      data: {}
      message:
        type: string
      meta:
        $ref: '#/definitions/response.PaginationMeta'
      statusCode:
        type: integer
      success:
        type: boolean
    type: object
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: Authentication service for Toca ecosystem
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Toca Auth API
  version: "1.0"
paths:
  /auth/accept-invite:
    post:
      consumes:
      - application/json
      description: Accept an invitation to join a company
      parameters:
      - description: Accept Invitation Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_oginoino_toca-auth_internal_domain_invitation.AcceptInvitationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Accept invitation
      tags:
      - auth
  /auth/companies:
    get:
      consumes:
      - application/json
      description: List all companies the user belongs to
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/github_com_oginoino_toca-auth_internal_api_v1_dto.AccountResponse'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: List user companies
      tags:
      - auth
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Request a password reset email
      parameters:
      - description: Forgot Password Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_oginoino_toca-auth_internal_domain_auth.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
      summary: Request password reset
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Login with email and password
      parameters:
      - description: Login Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_oginoino_toca-auth_internal_domain_auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/github_com_oginoino_toca-auth_internal_domain_auth.TokenPair'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
      summary: Login user
      tags:
      - auth
  /auth/logout:
    post:
      description: Invalidates the current session and clears the refresh token cookie
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Logout current session
      tags:
      - auth
  /auth/logout-all:
    post:
      description: Invalidates all sessions for the current user across all devices
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Logout all sessions
      tags:
      - auth
  /auth/me:
    get:
      consumes:
      - application/json
      description: Get information about the currently logged in user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  additionalProperties: true
                  type: object
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Get current user info
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Get a new access token using a refresh token
      parameters:
      - description: Refresh Token Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_oginoino_toca-auth_internal_domain_auth.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/github_com_oginoino_toca-auth_internal_domain_auth.TokenPair'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
      summary: Refresh access token
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Register a new user with the provided details
      parameters:
      - description: Register Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_oginoino_toca-auth_internal_domain_auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/github_com_oginoino_toca-auth_internal_domain_auth.TokenPair'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      summary: Register a new user
      tags:
      - auth
  /auth/reset-password:
    post:
      consumes:
      - application/json
      description: Applies a new password using the access/refresh pair from the Supabase
        recovery link fragment
      parameters:
      - description: Recovery session and new password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_oginoino_toca-auth_internal_domain_auth.ResetPasswordWithSessionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
      summary: Reset password with a recovery session
      tags:
      - auth
  /auth/switch-context:
    post:
      consumes:
      - application/json
      description: Switch the active company context and get new tokens
      parameters:
      - description: Switch Context Request
        in: body
        name: request
        required: true
        schema:
          properties:
            company_id:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/github_com_oginoino_toca-auth_internal_domain_auth.TokenPair'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Switch company context
      tags:
      - auth
  /companies:
    post:
      consumes:
      - application/json
      description: Create a new company for the user
      parameters:
      - description: Create Company Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_oginoino_toca-auth_internal_domain_auth.CreateCompanyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/github_com_oginoino_toca-auth_internal_api_v1_dto.AccountResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Create a new company
      tags:
      - companies
  /companies/{id}:
    get:
      consumes:
      - application/json
      description: Get details of a specific company
      parameters:
      - description: Company ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
