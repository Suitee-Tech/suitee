  /lgpd/me/account:
    delete:
      consumes:
      - application/json
      description: |-
        Anonimiza os dados pessoais do usuário corrente em
        TODOS os domains registrados (auth, crm.lead, deal.party,
        etc.). PII é substituído por hash determinístico do
        pkg/gdpr; foreign keys (account_id) preservadas pra que
        histórico de negócio continue íntegro. Requer
        confirmação textual no body. Irreversível.
      parameters:
      - description: Confirmação
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_api_v1_handlers.DeleteMyAccountRequest'
      produces:
