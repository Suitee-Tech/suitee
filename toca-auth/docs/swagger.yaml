            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: LGPD Art. 18 — direito ao esquecimento (#476)
      tags:
      - lgpd
