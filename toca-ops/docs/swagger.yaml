paths:
  /inspections/{id}/findings/{finding_id}/photos:
    post:
      consumes:
      - multipart/form-data
      description: 'Multipart endpoint que aceita até 5 fotos para uma Finding específica
        da Inspection. Backend processa (resize 1920px largest side, JPEG q=85), faz
        upload para storage privado prefixed por tenant_id, devolve URLs e anexa em
        Finding.Photos. Issue #440.'
      parameters:
      - description: Inspection ID
        in: path
        name: id
        required: true
        type: string
      - description: Finding ID (UUID estável dentro da Inspection)
        in: path
        name: finding_id
        required: true
        type: string
      - description: Foto (1..5 arquivos no campo files)
        in: formData
        name: files
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  type: object
              type: object
        "400":
          description: request malformado
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: tenant context required
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: inspection / finding not found
          schema:
            $ref: '#/definitions/response.Response'
        "422":
          description: nenhuma foto válida processada
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Upload photos to an inspection finding
      tags:
      - inspections
  /inspections/{id}/generate-laudo:
    post:
      description: |-
        Renderiza o laudo a partir das Findings registradas
        (HTML → Gotenberg), faz upload no storage e grava a
        ReportURL na inspeção. Regerar sobrescreve a versão
        anterior. Necessário antes de marcar a vistoria como
        Concluída (que exige ReportURL preenchida).
      parameters:
      - description: Inspection ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/github_com_oginoino_toca_toca-ops_internal_models_inspection.Inspection'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
        "503":
          description: renderer de PDF indisponível
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Gerar PDF do laudo de vistoria (#435)
      tags:
      - inspections
  /inspections/template:
    get:
      description: 'Devolve o template de checklist da vistoria configurado para o
        tenant atual. Quando não há override, devolve o template default residencial.
        Issue #432.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/internal_handlers.InspectionTemplateRoom'
                  type: array
              type: object
        "403":
          description: tenant context required
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Get inspection template for tenant
      tags:
      - inspections
swagger: "2.0"
