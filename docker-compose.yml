        PUBLIC_SITE_HOST_SUFFIX: ${PUBLIC_SITE_HOST_SUFFIX:-imoveis.localhost}
    ports:
      - "${WEB_PORT:-3002}:3000"
    environment:
      - PORT=3000
      - DATABASE_URI=${DATABASE_URI:-postgresql://postgres:postgres@postgres:5432/toca?sslmode=disable}
