      - PORTAL_SERVICE_URL=http://toca-portal:8089
      - SIGNATURE_SERVICE_URL=http://toca-signature:8093
      - SITES_SERVICE_URL=http://toca-sites:8094
      - PUBLIC_SITE_CORS_ORIGIN=${SITES_PUBLIC_CORS_ORIGIN:-http://*.imoveis.localhost}

    depends_on:
