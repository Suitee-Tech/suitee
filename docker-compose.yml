    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - PORT=8090
      - GATEWAY_URL=http://gateway:8080
      # As rotas /mcp/* passaram a validar o JWT do usuário com o mesmo
      # middleware dos outros serviços (P0/C7). Sem a URL do Supabase o
      # `pkgAuth.InitJWKS` falha e o grupo inteiro responde 401 — o painel de IA
      # anunciava "Servidor MCP desconectado" e nenhuma ferramenta ficava
      # disponível. O `docker-compose.prod.yml` já passava esta variável; o stack
      # local não, então o endurecimento do C7 quebrou o MCP só no dev.
      - SUPABASE_URL=${SUPABASE_URL:?SUPABASE_URL_required}
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8090/ready" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - toca-network

  # OCR: wrapper FastAPI em volta do docling. Converte documentos (PDF/imagem)
  # em markdown/texto + confiança do OCR. Único serviço Python; sem porta
  # pública — só o toca-ai consome, dentro da toca-network. Imagem pesada
  # (torch/easyocr): o primeiro start pode baixar modelos (mitigado pelo volume
  # docling_models + start_period generoso).
  toca-ocr:
    build:
      context: ./toca-ocr
      dockerfile: Dockerfile
      args:
        # 1 = imagem sem os modelos do Docling (dev local com o volume
        # docling_models já populado). O build normal baixa e embute os modelos.
        SKIP_MODEL_DOWNLOAD: ${SKIP_MODEL_DOWNLOAD:-0}
    # A base do Dockerfile é pinada por digest em linux/amd64 (ver comentário no
    # toca-ocr/Dockerfile), então em Apple Silicon esta imagem roda por
    # emulação e o Docker emite o aviso "requested image's platform ... does not
    # match the host platform". O aviso é esperado e não impede o boot — não
    # declare `platform:` aqui: no Docker Desktop com image store do containerd
    # isso faz o `up --no-build` tentar baixar a imagem do registry e falhar.
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:?INTERNAL_API_KEY_required}
      - INTERNAL_SERVICE_KEYS=${INTERNAL_SERVICE_KEYS:-}
    volumes:
      - docling_models:/root/.cache
    mem_limit: ${OCR_MEMORY_LIMIT:-4g}
    cpus: "${OCR_CPU_LIMIT:-2.0}"
    healthcheck:
      test: [ "CMD", "python", "-c", "import httpx,sys; sys.exit(0 if httpx.get('http://localhost:5001/ready', timeout=5).status_code==200 else 1)" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - toca-network

  toca-ai:
    build:
      context: .
      dockerfile: toca-ai/Dockerfile
    ports:
      - "${AI_PORT:-8092}:8092"
    environment:
      - REDIS_URI=${REDIS_URI:-redis://redis:6379/}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - CORE_SERVICE_URL=http://toca-core:8082
      - PORT=8092
      - DATABASE_URI=${DATABASE_URI:?required}
      - DATABASE_URI_SERVICE=${DATABASE_URI_SERVICE:?required}
      - SUPABASE_JWKS_URL=${SUPABASE_JWKS_URL:?required}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:?required}
      - INTERNAL_SERVICE_KEYS=${INTERNAL_SERVICE_KEYS:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:?required}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-v4-flash}
      - MCP_SERVER_URL=${MCP_SERVER_URL:-http://toca-mcp:8090}
      - GATEWAY_URL=http://gateway:8080
      - OCR_SERVICE_URL=${OCR_SERVICE_URL:-http://toca-ocr:5001}
    depends_on:
      toca-mcp:
        condition: service_healthy
      gateway:
        condition: service_healthy
      # NOTE: toca-ocr is intentionally NOT a startup dependency. toca-ai only
      # calls it lazily during document extraction (async, via toca-deal), so
      # gating boot on the heavy, slow-warming docling image would needlessly
      # delay the AI server (and every deploy). If toca-ocr is down/warming,
      # extraction fails gracefully and retries via the DLQ.
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:8092/ready" ]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - toca-network

  # Frontend (opcional via profile)
  # Suba com: docker compose --env-file .env --profile frontend up -d
  toka-frontend:
    profiles: [ "frontend" ]
    build:
      context: ./toka
      dockerfile: Dockerfile
      args:
        # Usar URL relativa evita CORS e funciona com proxy do Nginx
        - VITE_APP_VERSION=${VITE_APP_VERSION:-unknown}
        - VITE_API_URL=/api/v1
        - VITE_IMGPROXY_URL=${VITE_IMGPROXY_URL:-}
        - VITE_MULTI_PARTY_UI=${VITE_MULTI_PARTY_UI:-true}
        # O mesmo default rápido e previsível é usado em local, CI e release.
        - BUILD_MINIFY=${BUILD_MINIFY:-esbuild}
    environment:
      - VITE_APP_VERSION=${VITE_APP_VERSION:-unknown}
      # O entrypoint recusa subir sem esta chave em runtime (env.js). URL
      # relativa usa o proxy /api/ do nginx para o gateway.
      - VITE_API_URL=${VITE_API_URL:-/api/v1}
      - VITE_SUPABASE_URL=${SUPABASE_PUBLIC_URL:-http://localhost:54321}
      - VITE_MULTI_PARTY_UI=${VITE_MULTI_PARTY_UI:-true}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - toca-network

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  uploads_data:
  minio_data:
  prometheus_data:
  grafana_data:
  loki_data:
  docling_models:
  clamav_db:

networks:
  toca-network:
    driver: bridge
