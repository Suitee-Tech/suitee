      - CORE_SERVICE_URL=http://toca-core:8082
      - CRM_SERVICE_URL=http://toca-crm:8084
      - PAYLOAD_API_URL=http://toca-web:3000
      - PUBLIC_SITE_HOST_SUFFIX=${PUBLIC_SITE_HOST_SUFFIX:-imoveis.localhost}
      - SITE_PUBLIC_SCHEME=${SITE_PUBLIC_SCHEME:-http}
      # Porta do Next no host local (produção não define: 443 implícita).
      - SITE_PUBLIC_PORT=${SITE_PUBLIC_PORT:-${WEB_PORT:-3002}}
      - SITES_PUBLIC_CORS_ORIGIN=${SITES_PUBLIC_CORS_ORIGIN:-http://*.imoveis.localhost}
