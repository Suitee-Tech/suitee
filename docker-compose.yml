      - SITE_PUBLIC_SCHEME=${SITE_PUBLIC_SCHEME:-http}
      - SITE_NOINDEX=${SITE_NOINDEX:-false}
      - PORTAL_PUBLIC_URL=${PORTAL_PUBLIC_URL:-http://localhost:3000/portal}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:?INTERNAL_API_KEY_required}
      - SITES_INTERNAL_API_URL=http://toca-sites:8094
      - NEXT_PUBLIC_SITES_API_URL=${NEXT_PUBLIC_SITES_API_URL:-http://localhost:8094}
      - NEXT_PUBLIC_SITE_HOST_SUFFIX=${PUBLIC_SITE_HOST_SUFFIX:-imoveis.localhost}
    depends_on:
      toca-sites:
        condition: service_healthy
      toca-web-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health" ]
