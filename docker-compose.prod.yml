  # P1-13: antivírus do funil de uploads (clamd na porta 3310). O toca-deal
  # fala o protocolo INSTREAM direto; imagem pinada por digest (ver P1-16).
  clamav:
    <<: *default-logging
    image: clamav/clamav:stable@sha256:7659dcb0db47941d3cf8336af84bbb63c7e70b76fc00601774358412b42ed186
    container_name: clamav
    expose:
      - "3310"
    mem_limit: 512m
    volumes:
      # P1-13: baixa apenas o main.cvd (host ~4 GB de RAM) — ver o arquivo.
      - ./deploy/clamav/freshclam.conf:/etc/clamav/freshclam.conf:ro
      # Banco de assinaturas em volume: sem isso cada recriação baixa
      # o main.cvd de novo e o boot passa de 8 minutos (deploy estoura o gate).
      - clamav_db:/var/lib/clamav
    environment:
      - CLAMD_STARTUP_TIMEOUT=600
    healthcheck:
      # clamdscan --ping EXIGE argumento nesta versão; sem ele o container
      # ficava unhealthy e o deploy falhava no wait_for_stack.
      test: ["CMD", "clamdscan", "--ping=3"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 600s
    restart: unless-stopped
    networks:
      - toca-network

