x-rabbitmq-ready: &rabbitmq-ready
  rabbitmq:
    condition: service_healthy

# Serviços que falam com o Redis (sessão, cota de OTP, lembretes) esperam o
# Redis ficar SAUDÁVEL antes de subir. Sem isso o processo sobe antes do DNS
# `redis` existir, o cliente nasce nulo e o serviço segue assim até ser
# recriado — foi o que derrubou o login em produção (POST /auth/otp/request
# com panic de ponteiro nulo).
x-service-ready: &service-ready
  rabbitmq:
    condition: service_healthy
  redis:
    condition: service_healthy

# Rotação de logs no próprio container: sem isso o json-file do Docker cresce
# sem limite a cada deploy (cada recriação mantém o log anterior). 10 MB × 3
# arquivos por serviço é folga de sobra para triagem e trava o crescimento.
x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # ─────────────────────────────────────────
  # Reverse Proxy (Traefik) - Handles SSL/TLS and Routing
  # ─────────────────────────────────────────
  traefik:
    <<: *default-logging
    image: traefik:v2.10@sha256:a6b19e415e41b0e48b5c81713f3a60693a38f292059bd7347eef78bc9ae8044a
    container_name: traefik
    command:
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      # Routers TLS por imobiliária são gerados pelo toca-sites no volume
      # compartilhado. O file provider recarrega sem recriar containers.
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Enable Let's Encrypt (ACME)
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      # A hierarquia Generation Y (YR1/Root YR) ainda não está no trust store
      # do Chrome/macOS. A cadeia alternativa X1 é a compatível.
      - "--certificatesresolvers.myresolver.acme.preferredchain=ISRG Root X1"
      - "--certificatesresolvers.myresolver.acme.email=${ACME_EMAIL:-admin@suitee.com.br}"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
      # IMPORTANT: If testing and hitting Let's Encrypt limits, uncomment the line below to use Staging server:
      # - "--certificatesresolvers.myresolver.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory"
      # Global redirect to HTTPS
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "letsencrypt_data:/letsencrypt"
      - "site_tls_dynamic:/etc/traefik/dynamic:ro"
    restart: unless-stopped
    networks:
      - toca-network

  # ─────────────────────────────────────────
  # Frontend (Served via highly optimized Nginx)
  # ─────────────────────────────────────────
  toka-frontend:
    <<: *default-logging
    image: ghcr.io/${GITHUB_REPOSITORY}/toca-frontend:${IMAGE_TAG:?IMAGE_TAG must be a full release SHA}
    container_name: toca-frontend
    restart: unless-stopped
    environment:
      - VITE_APP_VERSION=${IMAGE_TAG}
      - VITE_API_URL=${PUBLIC_API_URL:-https://api.suitee.com.br}/api/v1
      - VITE_MEDIA_URL=${PUBLIC_API_URL:-https://api.suitee.com.br}
      - VITE_MULTI_PARTY_UI=true
      - VITE_SUPABASE_URL=${SUPABASE_PUBLIC_URL:-${SUPABASE_URL:?SUPABASE_URL_required}}
      # Produção sempre indexa; o overlay de beta sobrescreve para true.
      - SITE_NOINDEX=false
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      # O rolling update usa este healthcheck como sinal de prontidão do gêmeo;
      # sem `start_interval` a primeira checagem só aconteceria em 30s e cada
      # troca do frontend ficaria lenta sem necessidade.
      start_period: 15s
      start_interval: 5s
    labels:
      - "traefik.enable=true"
      # Route app.suitee.com.br to frontend
      - "traefik.http.routers.frontend.rule=Host(`${FRONTEND_HOST:-app.suitee.com.br}`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=myresolver"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
    networks:
      - toca-network

  # ─────────────────────────────────────────
  # Base Infrastructure
  # ─────────────────────────────────────────
  redis:
    <<: *default-logging
    image: redis:alpine@sha256:2d3814be5e9b06a30a0be54770b7e12052e7e79ec85271aefd34875c1f393b23
    container_name: toca-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - toca-network

  rabbitmq:
    <<: *default-logging
    image: rabbitmq:3.13.7-management@sha256:e582c0bc7766f3342496d8485efb5a1df782b5ce3886ad017e2eaae442311f69
    container_name: toca-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER:-toca_mq_user}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      # Run as the broker user so a startup probe cannot create a root-owned
      # Erlang cookie. Port connectivity is the actual dependency contract.
      test: [ "CMD", "gosu", "rabbitmq", "rabbitmq-diagnostics", "-q", "check_port_connectivity" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 300s
    restart: unless-stopped
    networks:
      - toca-network

  jaeger:
    <<: *default-logging
    image: jaegertracing/all-in-one:latest@sha256:968b31672178558da8a0c1bfc86336647d756ee6997ca196698796f5262adef1
    container_name: jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    restart: unless-stopped
    networks:
      - toca-network

  prometheus:
    <<: *default-logging
    image: prom/prometheus:v2.55.0@sha256:fe47ca5a4eb2ef06d7adaa583776b1f8e57f1e2a509ab500c538a3c07ebd9625
    container_name: toca-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./docs/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docs/observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped
    networks:
      - toca-network

  loki:
    <<: *default-logging
    image: grafana/loki:3.1.1@sha256:609c03d2e9becb0bb6b5f4f7e88d05e38321520c23e02e8b00c1caaf60b13523
    container_name: toca-loki
    command:
      - "-config.file=/etc/loki/loki.yml"
    volumes:
      - ./docs/observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    restart: unless-stopped
    networks:
      - toca-network

  promtail:
    <<: *default-logging
    image: grafana/promtail:3.1.1@sha256:34a7b851f2f300e35d6b37020aa62c5454d07a40b8ce655a9a1d3eefbb8ae333
    container_name: toca-promtail
    command:
      - "-config.file=/etc/promtail/promtail.yml"
    volumes:
      - ./docs/observability/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    restart: unless-stopped
    depends_on:
      - loki
    networks:
      - toca-network

  grafana:
    <<: *default-logging
    image: grafana/grafana:11.2.0@sha256:37a5d8860aef847dfa09f5f8947f010f6479f98cf7820b5186f9c6314b44be60
    container_name: toca-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docs/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docs/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`${GRAFANA_HOST:-grafana.example.com}`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=myresolver"
      - "traefik.http.routers.grafana.middlewares=grafana-auth,grafana-ip"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
      - "traefik.http.middlewares.grafana-auth.basicauth.users=${GRAFANA_BASIC_AUTH_USERS:?GRAFANA_BASIC_AUTH_USERS_required}"
      - "traefik.http.middlewares.grafana-ip.ipwhitelist.sourcerange=${GRAFANA_ALLOWED_IPS:?GRAFANA_ALLOWED_IPS_required}"
    networks:
      - toca-network

  # ─────────────────────────────────────────
  # API Gateway (Routes /api requests)
  # ─────────────────────────────────────────
  gateway:
    <<: *default-logging
    image: ghcr.io/${GITHUB_REPOSITORY}/toca-gateway:${IMAGE_TAG:?IMAGE_TAG must be a full release SHA}
    container_name: toca-gateway
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - APP_ENV=production
      - APP_MODE=release
      - PORT=8080
      - GATEWAY_METRICS_PORT=9091
      - PLATFORM_ACCESS_CONTROL_ENABLED=${PLATFORM_ACCESS_CONTROL_ENABLED:-false}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}
      - FRONTEND_URL=${PUBLIC_FRONTEND_URL:-https://app.suitee.com.br}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS_required}
      - ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS_required}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:?INTERNAL_API_KEY_required}
      - INTERNAL_CALLER_KEY=${INTERNAL_CALLER_KEY_GATEWAY:-}
      - INTERNAL_SERVICE_KEYS=${INTERNAL_SERVICE_KEYS:-}
      - APP_TIMEZONE=${APP_TIMEZONE:-America/Sao_Paulo}
      - AUTH_SERVICE_URL=http://toca-auth:8081
      - CORE_SERVICE_URL=http://toca-core:8082
      - FINANCIAL_SERVICE_URL=http://toca-financial:8083
      - CRM_SERVICE_URL=http://toca-crm:8084
      - DEAL_SERVICE_URL=http://toca-deal:8085
      - COMM_SERVICE_URL=http://toca-comm:8086
      - OPS_SERVICE_URL=http://toca-ops:8087
      - CALENDAR_SERVICE_URL=http://toca-calendar:8088
      - PORTAL_SERVICE_URL=http://toca-portal:8089
      - AI_SERVICE_URL=http://toca-ai:8092
      - SIGNATURE_SERVICE_URL=http://toca-signature:8093
      - SITES_SERVICE_URL=http://toca-sites:8094
      - PUBLIC_SITE_CORS_ORIGIN=https://*.${PUBLIC_SITE_HOST_SUFFIX:-imoveis.suitee.com.br}
    expose:
      - "9091" # listener interno de métricas (scrape do Prometheus na toca-network)
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      # P2/B1: a borda não publica /metrics. O scrape é interno
      # (gateway:9091, não exposto nem publicado) e a exclusão abaixo garante
      # 404 na borda mesmo se a rota voltar a existir por engano.
      - "traefik.http.routers.gateway.rule=Host(`${API_HOST:-api.suitee.com.br}`) && !PathPrefix(`/metrics`)"
      - "traefik.http.routers.gateway.entrypoints=websecure"
      - "traefik.http.routers.gateway.tls.certresolver=myresolver"
      - "traefik.http.services.gateway.loadbalancer.server.port=8080"
    networks:
      - toca-network

  # ─────────────────────────────────────────
  # Microservices
  # ─────────────────────────────────────────
  toca-auth:
    <<: *default-logging
    image: ghcr.io/${GITHUB_REPOSITORY}/toca-auth:${IMAGE_TAG:?IMAGE_TAG must be a full release SHA}
    container_name: toca-auth
    expose:
      - "8081"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - CORE_SERVICE_URL=http://toca-core:8082
      # Recuperação de senha notifica pelo toca-comm (clients.NewCommClient em
      # password_service.go). Sem a URL o client nasce com base vazia e a
      # notificação falha em silêncio.
      - COMM_SERVICE_URL=http://toca-comm:8086
      - APP_ENV=production
      - APP_MODE=release
      - PORT=8081
      - SUPABASE_DB_URL=${SUPABASE_DB_URL:?SUPABASE_DB_URL_required}
      - DATABASE_URI=${DATABASE_URI:?DATABASE_URI_required}
      - DATABASE_URI_SERVICE=${DATABASE_URI_SERVICE:?DATABASE_URI_SERVICE_required}
      - DATABASE_NAME=toca_auth
      - DATABASE_MAX_POOL_SIZE=${DATABASE_MAX_POOL_SIZE:-5}
      - DATABASE_MIN_POOL_SIZE=${DATABASE_MIN_POOL_SIZE:-1}
      - SUPABASE_URL=${SUPABASE_URL:?SUPABASE_URL_required}
      - SUPABASE_PUBLIC_URL=${SUPABASE_PUBLIC_URL:-${SUPABASE_URL:?SUPABASE_URL_required}}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:?SUPABASE_ANON_KEY_required}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY_required}
      - STORAGE_PROVIDER=supabase
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:?INTERNAL_API_KEY_required}
      - INTERNAL_CALLER_KEY=${INTERNAL_CALLER_KEY_TOCA_AUTH:-}
      - INTERNAL_SERVICE_KEYS=${INTERNAL_SERVICE_KEYS:-}
      - APP_TIMEZONE=${APP_TIMEZONE:-America/Sao_Paulo}
      - RABBITMQ_URI=amqp://${RABBITMQ_DEFAULT_USER:-toca_mq_user}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
      - FRONTEND_URL=${PUBLIC_FRONTEND_URL:-https://app.suitee.com.br}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS_required}
      - REDIS_URI=redis://redis:6379/
    depends_on: *service-ready
    restart: unless-stopped
    networks:
      - toca-network

  toca-core:
    <<: *default-logging
    image: ghcr.io/${GITHUB_REPOSITORY}/toca-core:${IMAGE_TAG:?IMAGE_TAG must be a full release SHA}
    container_name: toca-core
    expose:
      - "8082"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - APP_ENV=production
      - APP_MODE=release
      - PORT=8082
      - SUPABASE_DB_URL=${SUPABASE_DB_URL:?SUPABASE_DB_URL_required}
      - DATABASE_URI=${DATABASE_URI:?DATABASE_URI_required}
      - DATABASE_URI_SERVICE=${DATABASE_URI_SERVICE:?DATABASE_URI_SERVICE_required}
      - DATABASE_NAME=toca_core
      - DATABASE_MAX_POOL_SIZE=${DATABASE_MAX_POOL_SIZE:-5}
      - DATABASE_MIN_POOL_SIZE=${DATABASE_MIN_POOL_SIZE:-1}
      - ADDRESS_VERIFICATION_MODE=${ADDRESS_VERIFICATION_MODE:-best_effort}
      - ADDRESS_VERIFICATION_PROVIDER=${ADDRESS_VERIFICATION_PROVIDER:-viacep}
      - ADDRESS_VERIFICATION_BASE_URL=${ADDRESS_VERIFICATION_BASE_URL:-https://viacep.com.br}
      - ADDRESS_VERIFICATION_TIMEOUT=${ADDRESS_VERIFICATION_TIMEOUT:-2s}
      - ADDRESS_VERIFICATION_CACHE_TTL=${ADDRESS_VERIFICATION_CACHE_TTL:-24h}
      - ADDRESS_VERIFICATION_CACHE_MAX_ENTRIES=${ADDRESS_VERIFICATION_CACHE_MAX_ENTRIES:-10000}
      - SUPABASE_URL=${SUPABASE_URL:?SUPABASE_URL_required}
      - SUPABASE_PUBLIC_URL=${SUPABASE_PUBLIC_URL:-${SUPABASE_URL:?SUPABASE_URL_required}}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:?SUPABASE_ANON_KEY_required}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY_required}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:?INTERNAL_API_KEY_required}
      - INTERNAL_CALLER_KEY=${INTERNAL_CALLER_KEY_TOCA_CORE:-}
      - INTERNAL_SERVICE_KEYS=${INTERNAL_SERVICE_KEYS:-}
      - APP_TIMEZONE=${APP_TIMEZONE:-America/Sao_Paulo}
      - RABBITMQ_URI=amqp://${RABBITMQ_DEFAULT_USER:-toca_mq_user}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS_required}
      - STORAGE_PROVIDER=supabase
      # A5: invalidação do cache de permissões ao salvar a matriz. Opcional —
      # sem isto a revogação propaga apenas pelo TTL de 30s dos consumidores.
      - REDIS_URI=${REDIS_URI:-redis://redis:6379/}
    depends_on: *service-ready
    restart: unless-stopped
    networks:
      - toca-network

  toca-financial:
    <<: *default-logging
    image: ghcr.io/${GITHUB_REPOSITORY}/toca-financial:${IMAGE_TAG:?IMAGE_TAG must be a full release SHA}
    container_name: toca-financial
    expose:
      - "8083"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - APP_ENV=production
      - APP_MODE=release
      - FINANCIAL_ADJUSTMENT_APPROVAL_THRESHOLD_BRL=${FINANCIAL_ADJUSTMENT_APPROVAL_THRESHOLD_BRL:-5000}
      - PORT=8083
      - SUPABASE_DB_URL=${SUPABASE_DB_URL:?SUPABASE_DB_URL_required}
      - DATABASE_URI=${DATABASE_URI:?DATABASE_URI_required}
      - DATABASE_URI_SERVICE=${DATABASE_URI_SERVICE:?DATABASE_URI_SERVICE_required}
      - DATABASE_NAME=toca_financial
      - DATABASE_MAX_POOL_SIZE=${DATABASE_MAX_POOL_SIZE:-5}
      - DATABASE_MIN_POOL_SIZE=${DATABASE_MIN_POOL_SIZE:-1}
      - SUPABASE_URL=${SUPABASE_URL:?SUPABASE_URL_required}
      - SUPABASE_PUBLIC_URL=${SUPABASE_PUBLIC_URL:-${SUPABASE_URL:?SUPABASE_URL_required}}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:?SUPABASE_ANON_KEY_required}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY_required}
      - STORAGE_PROVIDER=supabase
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:?INTERNAL_API_KEY_required}
      - INTERNAL_CALLER_KEY=${INTERNAL_CALLER_KEY_TOCA_FINANCIAL:-}
      - INTERNAL_SERVICE_KEYS=${INTERNAL_SERVICE_KEYS:-}
      - APP_TIMEZONE=${APP_TIMEZONE:-America/Sao_Paulo}
      - PAYMENT_GATEWAY_API_KEY=${PAYMENT_GATEWAY_API_KEY}
      # Provedor do LINK DE COBRANÇA por cobrança (Pix/boleto). Vazio (padrão) =
      # a rota responde 409 e o portal do cliente esconde os botões de pagar;
      # `sandbox` gera links determinísticos e NÃO cobráveis — ligado apenas no
      # beta para validação, nunca em produção enquanto não houver gateway real.
      - PAYMENT_PROVIDER=${PAYMENT_PROVIDER:-}
      - PLATFORM_SUBSCRIPTIONS_ENABLED=${PLATFORM_SUBSCRIPTIONS_ENABLED:-false}
      - PLATFORM_ACCESS_CONTROL_ENABLED=${PLATFORM_ACCESS_CONTROL_ENABLED:-false}
      - ABACATEPAY_DEV_MODE=${ABACATEPAY_DEV_MODE:-false}
      - PUBLIC_FRONTEND_URL=${PUBLIC_FRONTEND_URL:-http://localhost:3000}
      - ABACATEPAY_WEBHOOK_SECRET=${ABACATEPAY_WEBHOOK_SECRET}
      - ABACATEPAY_WEBHOOK_ALLOWED_IPS=${ABACATEPAY_WEBHOOK_ALLOWED_IPS}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}
      - RABBITMQ_URI=amqp://${RABBITMQ_DEFAULT_USER:-toca_mq_user}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
      - CORE_SERVICE_URL=http://toca-core:8082
      - DEAL_SERVICE_URL=http://toca-deal:8085
      # Cobranças/repasses resolvem a parte (lead) no CRM e notificam pelo comm
      # (charge_service.go, transfer_handler.go). As duas URLs faltavam: as
      # notificações financeiras falhavam em silêncio.
      - CRM_SERVICE_URL=http://toca-crm:8084
      - COMM_SERVICE_URL=http://toca-comm:8086
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS_required}
      - REDIS_URI=redis://redis:6379/
    depends_on: *service-ready
    restart: unless-stopped
    networks:
      - toca-network

  toca-crm:
    <<: *default-logging
    image: ghcr.io/${GITHUB_REPOSITORY}/toca-crm:${IMAGE_TAG:?IMAGE_TAG must be a full release SHA}
    container_name: toca-crm
    expose:
      - "8084"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - APP_ENV=production
      - APP_MODE=release
      - PORT=8084
      - SUPABASE_DB_URL=${SUPABASE_DB_URL:?SUPABASE_DB_URL_required}
      - DATABASE_URI=${DATABASE_URI:?DATABASE_URI_required}
      - DATABASE_URI_SERVICE=${DATABASE_URI_SERVICE:?DATABASE_URI_SERVICE_required}
      - DATABASE_NAME=toca_crm
      - DATABASE_MAX_POOL_SIZE=${DATABASE_MAX_POOL_SIZE:-5}
      - DATABASE_MIN_POOL_SIZE=${DATABASE_MIN_POOL_SIZE:-1}
      - SUPABASE_URL=${SUPABASE_URL:?SUPABASE_URL_required}
      - SUPABASE_PUBLIC_URL=${SUPABASE_PUBLIC_URL:-${SUPABASE_URL:?SUPABASE_URL_required}}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:?SUPABASE_ANON_KEY_required}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY_required}
      - STORAGE_PROVIDER=supabase
      - AUTH_SERVICE_URL=http://toca-auth:8081
