basePath: /api/v1
definitions:
  github_com_oginoino_toca_toca-comm_internal_domain_message.Attachment:
    properties:
      id:
        type: string
      name:
        type: string
      size:
        type: integer
      type:
        description: mime type
        type: string
      url:
        type: string
    type: object
  github_com_oginoino_toca_toca-comm_internal_domain_message.Channel:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      entity_id:
        description: 'Optional: linked lead/deal ID'
        type: string
      entity_type:
        description: '"lead", "deal", "contract"'
        type: string
      id:
        type: string
      info:
        allOf:
        - $ref: '#/definitions/github_com_oginoino_toca_toca-comm_internal_domain_message.ChannelInfo'
        description: Structured info panel data
      last_message:
        $ref: '#/definitions/github_com_oginoino_toca_toca-comm_internal_domain_message.Message'
      muted_by:
        description: User IDs who muted this channel
        items:
          type: string
        type: array
      name:
        type: string
      participant_profiles:
        items:
          $ref: '#/definitions/github_com_oginoino_toca_toca-comm_internal_domain_message.ParticipantProfile'
        type: array
      participants:
        description: Account IDs
        items:
          type: string
        type: array
      pinned_by:
        description: User IDs who pinned this channel
        items:
          type: string
        type: array
      status:
        $ref: '#/definitions/github_com_oginoino_toca_toca-comm_internal_domain_message.ChannelStatus'
      tenant_id:
        type: string
      type:
        $ref: '#/definitions/github_com_oginoino_toca_toca-comm_internal_domain_message.ChannelType'
      updated_at:
        type: string
    type: object
  github_com_oginoino_toca_toca-comm_internal_domain_message.ChannelInfo:
    properties:
      sections:
        items:
          $ref: '#/definitions/github_com_oginoino_toca_toca-comm_internal_domain_message.ChannelInfoSection'
        type: array
    type: object
  github_com_oginoino_toca_toca-comm_internal_domain_message.ChannelInfoItem:
    properties:
      label:
        type: string
      link:
        type: string
      value:
        type: string
    type: object
  github_com_oginoino_toca_toca-comm_internal_domain_message.ChannelInfoSection:
    properties:
      items:
        items:
          $ref: '#/definitions/github_com_oginoino_toca_toca-comm_internal_domain_message.ChannelInfoItem'
        type: array
      label:
        type: string
    type: object
  github_com_oginoino_toca_toca-comm_internal_domain_message.ChannelStatus:
    enum:
    - open
    - closed
    - archived
    type: string
    x-enum-varnames:
    - ChannelStatusOpen
    - ChannelStatusClosed
    - ChannelStatusArchived
  github_com_oginoino_toca_toca-comm_internal_domain_message.ChannelType:
    enum:
    - direct
    - group
    - support
    - lead
    - deal
    type: string
    x-enum-comments:
      ChannelTypeDeal: Linked to a deal
      ChannelTypeDirect: 1-to-1 between users
      ChannelTypeGroup: Group conversation
      ChannelTypeLead: Linked to a lead
      ChannelTypeSupport: Client support thread
    x-enum-descriptions:
    - 1-to-1 between users
    - Group conversation
    - Client support thread
    - Linked to a lead
    - Linked to a deal
    x-enum-varnames:
    - ChannelTypeDirect
    - ChannelTypeGroup
    - ChannelTypeSupport
    - ChannelTypeLead
    - ChannelTypeDeal
  github_com_oginoino_toca_toca-comm_internal_domain_message.Message:
    properties:
      attachments:
        items:
          $ref: '#/definitions/github_com_oginoino_toca_toca-comm_internal_domain_message.Attachment'
        type: array
      channel_id:
        type: string
      content:
        type: string
      content_type:
        description: '"text", "image", "file"'
        type: string
      edited_at:
        type: string
      hashtags:
        description: Strings
        items:
          type: string
        type: array
      id:
        type: string
      is_edited:
        type: boolean
      is_flagged:
        description: For moderation
        type: boolean
      is_pinned:
        type: boolean
      mentions:
        description: Account IDs
        items:
          type: string
        type: array
      reactions:
        items:
          $ref: '#/definitions/github_com_oginoino_toca_toca-comm_internal_domain_message.Reaction'
        type: array
      read_by:
        description: Account IDs who read the message
        items:
          type: string
        type: array
      reply_to_id:
        type: string
      sender_avatar_url:
        type: string
      sender_id:
        type: string
      sender_name:
        type: string
      sent_at:
        type: string
      tenant_id:
        type: string
    type: object
  github_com_oginoino_toca_toca-comm_internal_domain_message.Metrics:
    properties:
      active_users:
        type: integer
      avg_response_time_minutes:
        type: number
      flagged_messages:
        type: integer
      total_channels:
        type: integer
      total_messages:
        type: integer
    type: object
  github_com_oginoino_toca_toca-comm_internal_domain_message.ParticipantProfile:
    properties:
      avatar_url:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  github_com_oginoino_toca_toca-comm_internal_domain_message.Reaction:
    properties:
      emoji:
        type: string
      user_ids:
        items:
          type: string
        type: array
    type: object
  github_com_oginoino_toca_toca-comm_internal_domain_message.Template:
    properties:
      category:
        description: e.g., "visit", "proposal", "contract"
        type: string
      content:
        type: string
      created_at:
        type: string
      created_by:
        type: string
      id:
        type: string
      name:
        type: string
      tenant_id:
        type: string
      variables:
        description: e.g., ["client_name", "property_address", "date"]
        items:
          type: string
        type: array
    type: object
  github_com_oginoino_toca_toca-comm_internal_domain_notification.Notification:
    properties:
      content:
        type: string
      created_at:
        type: string
      error:
        type: string
      id:
        type: string
      recipient:
        description: Email, Phone, DeviceID
        type: string
      sent_at:
        type: string
      status:
        $ref: '#/definitions/github_com_oginoino_toca_toca-comm_internal_domain_notification.Status'
      subject:
        type: string
      type:
        $ref: '#/definitions/github_com_oginoino_toca_toca-comm_internal_domain_notification.Type'
    type: object
  github_com_oginoino_toca_toca-comm_internal_domain_notification.Status:
    enum:
    - PENDING
    - SENT
    - FAILED
    type: string
    x-enum-varnames:
    - StatusPending
    - StatusSent
    - StatusFailed
  github_com_oginoino_toca_toca-comm_internal_domain_notification.Type:
    enum:
    - EMAIL
    - SMS
    - PUSH
    - WHATSAPP
    type: string
    x-enum-varnames:
    - TypeEmail
    - TypeSMS
    - TypePush
    - TypeWhatsApp
  internal_api_v1_handlers.AddParticipantRequest:
    properties:
      participant_id:
        type: string
    required:
    - participant_id
    type: object
  internal_api_v1_handlers.AddReactionRequest:
    properties:
      emoji:
        type: string
    required:
    - emoji
    type: object
  internal_api_v1_handlers.CreateChannelRequest:
    properties:
      entity_id:
        type: string
      entity_type:
        type: string
      name:
        type: string
      participants:
        items:
          type: string
        type: array
      type:
        $ref: '#/definitions/github_com_oginoino_toca_toca-comm_internal_domain_message.ChannelType'
    required:
    - name
    - type
    type: object
  internal_api_v1_handlers.CreateTemplateRequest:
    properties:
      category:
        type: string
      content:
        type: string
      name:
        type: string
      variables:
        items:
          type: string
        type: array
    required:
    - category
    - content
    - name
    type: object
  internal_api_v1_handlers.EditMessageRequest:
    properties:
      content:
        type: string
    required:
    - content
    type: object
  internal_api_v1_handlers.SendMessageRequest:
    properties:
      attachments:
        items:
          $ref: '#/definitions/github_com_oginoino_toca_toca-comm_internal_domain_message.Attachment'
        type: array
      content:
        type: string
      content_type:
        type: string
      reply_to_id:
        type: string
    required:
    - content
    type: object
  internal_api_v1_handlers.SendNotificationRequest:
    properties:
      content:
        type: string
      recipient:
        type: string
      subject:
        type: string
      tenant_id:
        description: |-
          TenantID é a atribuição da mensagem. Opcional: notificações de sistema
          (ex.: e-mail de recuperação de senha, pedido antes de haver tenant) não
          têm tenant. Quando informado, passa pelo resolver — ver Send.
        type: string
      type:
        $ref: '#/definitions/github_com_oginoino_toca_toca-comm_internal_domain_notification.Type'
    required:
    - content
    - recipient
    - type
    type: object
  internal_api_v1_handlers.ToggleMuteChannelRequest:
    properties:
      is_muted:
        type: boolean
    type: object
  internal_api_v1_handlers.TogglePinChannelRequest:
    properties:
      is_pinned:
        type: boolean
    type: object
  internal_api_v1_handlers.TogglePinMessageRequest:
    properties:
      is_pinned:
        type: boolean
    type: object
  internal_api_v1_handlers.UpdateChannelRequest:
    properties:
      description:
        type: string
      info:
        $ref: '#/definitions/github_com_oginoino_toca_toca-comm_internal_domain_message.ChannelInfo'
      name:
        type: string
    type: object
  internal_api_v1_handlers.UpdateChannelStatusRequest:
    properties:
      status:
        type: string
    required:
    - status
    type: object
  response.PaginationMeta:
    properties:
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
      totalPages:
        type: integer
    type: object
  response.Response:
    properties:
      data: {}
      message:
        type: string
      meta:
        $ref: '#/definitions/response.PaginationMeta'
      statusCode:
        type: integer
      success:
        type: boolean
    type: object
host: localhost:8081
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: Communication service for Toca ecosystem
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Toca Comm API
  version: "1.0"
paths:
  /autocomplete:
    get:
      description: Returns suggestions for mentions (@) and hashtags (#)
      parameters:
      - description: 'Type of suggestion: mention or hashtag'
        in: query
        name: type
        required: true
        type: string
      - description: Search query
        in: query
        name: query
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Get autocomplete suggestions
      tags:
      - messages
  /channels:
    get:
      description: Returns all channels for the current tenant
      parameters:
      - description: Filter by entity ID (lead/deal)
        in: query
        name: entity_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/github_com_oginoino_toca_toca-comm_internal_domain_message.Channel'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: List channels
      tags:
      - messages
    post:
      consumes:
      - application/json
      description: Creates a new channel (direct, group, support, lead, deal) for
        the tenant
      parameters:
      - description: Create Channel Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_api_v1_handlers.CreateChannelRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/github_com_oginoino_toca_toca-comm_internal_domain_message.Channel'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Create a messaging channel
      tags:
      - messages
  /channels/{id}:
    get:
      description: Returns a single channel by ID
      parameters:
      - description: Channel ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/github_com_oginoino_toca_toca-comm_internal_domain_message.Channel'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Get a channel
      tags:
      - messages
    patch:
      consumes:
      - application/json
      description: Updates channel metadata (name, description)
      parameters:
      - description: Channel ID
        in: path
        name: id
        required: true
        type: string
      - description: Update Channel Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_api_v1_handlers.UpdateChannelRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/github_com_oginoino_toca_toca-comm_internal_domain_message.Channel'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Update a channel
      tags:
      - messages
  /channels/{id}/messages:
    get:
      description: Returns paginated messages for a channel
      parameters:
      - description: Channel ID
        in: path
        name: id
        required: true
        type: string
      - description: Limit (default 50)
        in: query
        name: limit
        type: integer
      - description: Offset (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Get messages in a channel
      tags:
      - messages
    post:
      consumes:
      - application/json
      description: Sends a message to a channel
      parameters:
      - description: Channel ID
        in: path
        name: id
        required: true
        type: string
      - description: Send Message Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_api_v1_handlers.SendMessageRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/github_com_oginoino_toca_toca-comm_internal_domain_message.Message'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Send a message
      tags:
      - messages
  /channels/{id}/messages/{messageId}:
    delete:
      description: Deletes a message from a channel (only by original sender)
      parameters:
      - description: Channel ID
        in: path
        name: id
        required: true
        type: string
      - description: Message ID
        in: path
        name: messageId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Delete a message
      tags:
      - messages
    patch:
      consumes:
      - application/json
      description: Edits the content of a message (only by original sender)
      parameters:
      - description: Channel ID
        in: path
        name: id
        required: true
        type: string
      - description: Message ID
        in: path
        name: messageId
        required: true
        type: string
      - description: Edit Message Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_api_v1_handlers.EditMessageRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/github_com_oginoino_toca_toca-comm_internal_domain_message.Message'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Edit a message
      tags:
      - messages
  /channels/{id}/messages/{messageId}/pin:
    patch:
      consumes:
      - application/json
      parameters:
      - description: Channel ID
        in: path
        name: id
        required: true
        type: string
      - description: Message ID
        in: path
        name: messageId
        required: true
        type: string
      - description: Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_api_v1_handlers.TogglePinMessageRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Pin or unpin a message
      tags:
      - messages
  /channels/{id}/messages/{messageId}/reactions:
    post:
      consumes:
      - application/json
      description: Adds an emoji reaction to a specific message
      parameters:
      - description: Channel ID
        in: path
        name: id
        required: true
        type: string
      - description: Message ID
        in: path
        name: messageId
        required: true
        type: string
      - description: Add Reaction Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_api_v1_handlers.AddReactionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Add a reaction to a message
      tags:
      - messages
  /channels/{id}/messages/{messageId}/reactions/{emoji}:
    delete:
      description: Removes an emoji reaction from a specific message
      parameters:
      - description: Channel ID
        in: path
        name: id
        required: true
        type: string
      - description: Message ID
        in: path
        name: messageId
        required: true
        type: string
      - description: Emoji
        in: path
        name: emoji
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Remove a reaction from a message
      tags:
      - messages
  /channels/{id}/messages/upload:
    post:
      consumes:
      - multipart/form-data
      description: Uploads a file to a channel and returns attachment metadata
      parameters:
      - description: Channel ID
        in: path
        name: id
        required: true
        type: string
      - description: File to upload
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/github_com_oginoino_toca_toca-comm_internal_domain_message.Attachment'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Upload an attachment
      tags:
      - messages
  /channels/{id}/mute:
    patch:
      consumes:
      - application/json
      parameters:
      - description: Channel ID
        in: path
        name: id
        required: true
        type: string
      - description: Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_api_v1_handlers.ToggleMuteChannelRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Mute or unmute a channel
      tags:
      - messages
  /channels/{id}/participants:
    post:
      consumes:
      - application/json
      description: Adds a participant to an existing channel
      parameters:
